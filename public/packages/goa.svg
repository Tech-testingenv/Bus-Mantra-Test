<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Soft Coastal Sun glow -->
    <radialGradient id="goa-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#fff7ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft ground shadow -->
    <radialGradient id="goa-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0c1621" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
    <!-- Coach body gradient -->
    <linearGradient id="goa-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goa-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <!-- Orange Livery -->
    <linearGradient id="goa-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <!-- Tinted Glass -->
    <linearGradient id="goa-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="goa-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="65%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </radialGradient>
  </defs>

  <!-- Ambient Coastal Sun Glow -->
  <circle cx="460" cy="115" r="110" fill="url(#goa-sun)"/>
  <circle cx="460" cy="115" r="45" fill="#fdba74" opacity="0.3"/>

  <!-- Subtle Minimalist Tropical Elements (Background) -->
  <g opacity="0.5">
    <!-- Gentle Coastal Ocean Waves -->
    <path d="M 280 230 Q 360 215 440 225 Q 520 215 600 230" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>
    <path d="M 320 242 Q 400 230 480 238 Q 550 228 600 240" fill="none" stroke="#e0f2fe" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Tropical Palm Tree 1 (Large) -->
    <!-- Trunk -->
    <path d="M 520 230 Q 510 160 480 90" fill="none" stroke="#9a3412" stroke-width="5" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 480 90 Q 430 70 410 100" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 480 90 Q 440 50 435 70" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 480 90 Q 480 40 495 65" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 480 90 Q 520 50 535 80" fill="none" stroke="#16a34a" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 480 90 Q 540 80 550 115" fill="none" stroke="#15803d" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 480 90 Q 510 105 525 130" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/>

    <!-- Tropical Palm Tree 2 (Smaller, Background) -->
    <!-- Trunk -->
    <path d="M 555 235 Q 550 180 535 125" fill="none" stroke="#9a3412" stroke-width="4" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 535 125 Q 495 110 480 135" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 535 125 Q 510 95 505 110" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 535 125 Q 545 90 560 115" fill="none" stroke="#15803d" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 535 125 Q 575 110 585 140" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Winding Coastal Route / Highway Vector -->
  <path d="M -20 335 Q 190 330 360 295 Q 470 268 560 215" fill="none" stroke="#e2e8f0" stroke-width="42" stroke-linecap="round"/>
  <path d="M -20 335 Q 190 330 360 295 Q 470 268 560 215" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Minimalist Goa Destination Location Pin -->
  <g transform="translate(480, 80) scale(0.9)">
    <circle cx="0" cy="0" r="14" fill="#ec6103" opacity="0.18"/>
    <path d="M 0 -18 C -7 -18 -12 -13 -12 -6 C -12 4 0 16 0 16 C 0 16 12 4 12 -6 C 12 -13 7 -18 0 -18 Z" fill="#ec6103"/>
    <circle cx="0" cy="-6" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Soft Ground Shadow under Luxury Coach -->
  <ellipse cx="280" cy="318" rx="230" ry="20" fill="url(#goa-shadow)"/>
  <ellipse cx="270" cy="315" rx="190" ry="12" fill="#0c1621" opacity="0.18"/>

  <!-- LUXURY COACH BUS (Foreground) -->
  <g transform="translate(10, 0)">
    <!-- Aerodynamic Roof AC Unit -->
    <path d="M 180 82 L 420 82 Q 445 82 455 90 L 460 98 L 150 98 L 165 88 Q 170 82 180 82 Z" fill="#e2e7ef" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="200" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="250" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="300" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="350" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>

    <!-- Main Coach Body Side -->
    <path d="M 155 98 Q 170 98 190 98 L 515 98 Q 535 98 540 114 L 535 268 Q 535 278 525 278 L 155 278 L 130 264 L 130 114 Q 135 98 155 98 Z" fill="url(#goa-body)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Cap (3/4 Angled Face) -->
    <path d="M 75 152 Q 88 102 130 96 L 155 98 L 155 278 L 88 275 Q 68 273 66 245 L 72 170 Q 74 156 75 152 Z" fill="url(#goa-front)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Windshield -->
    <path d="M 78 146 Q 90 108 128 102 L 155 100 L 155 195 L 85 195 L 77 166 Q 77 152 78 146 Z" fill="url(#goa-glass)"/>
    <line x1="155" y1="142" x2="80" y2="142" stroke="#0c1621" stroke-width="2"/>
    <path d="M 92 110 L 125 104 L 110 190 L 85 190 Z" fill="#ffffff" opacity="0.12"/>
    <!-- Wipers -->
    <line x1="115" y1="192" x2="135" y2="152" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="192" x2="112" y2="156" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Panoramic Side Windows (Touring Luxury Coach) -->
    <path d="M 165 105 L 245 105 L 245 188 L 165 188 Z" fill="url(#goa-glass)"/>
    <path d="M 252 105 L 340 105 L 340 188 L 252 188 Z" fill="url(#goa-glass)"/>
    <path d="M 347 105 L 435 105 L 435 188 L 347 188 Z" fill="url(#goa-glass)"/>
    <path d="M 442 105 L 525 105 Q 533 105 533 118 L 528 188 L 442 188 Z" fill="url(#goa-glass)"/>

    <!-- Chrome Window Trim Lines -->
    <line x1="165" y1="103" x2="530" y2="103" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="165" y1="190" x2="530" y2="190" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Sheen reflections -->
    <polygon points="180,105 210,105 185,188 165,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="275,105 310,105 285,188 255,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="375,105 410,105 385,188 355,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="470,105 505,105 480,188 450,188" fill="#ffffff" opacity="0.1"/>

    <!-- Brand Livery: Dynamic Bus Mantra Orange Swoosh -->
    <path d="M 70 224 Q 115 220 155 216 Q 235 208 315 228 Q 405 250 485 212 L 535 212 L 535 248 Q 445 282 360 254 Q 270 225 185 242 L 75 250 Z" fill="url(#goa-orange)"/>
    <path d="M 195 236 Q 275 222 365 252 Q 450 278 535 255 L 535 264 Q 450 286 365 261 Q 275 236 195 236 Z" fill="#0c1621" opacity="0.9"/>
    <path d="M 98 208 Q 130 205 155 208 L 155 213 Q 125 210 90 214 Z" fill="url(#goa-orange)"/>

    <!-- Luggage Bay Doors -->
    <rect x="225" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="245" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>
    <rect x="285" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="305" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>
    <rect x="345" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="365" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>

    <!-- Bus Mantra Logo Stamp -->
    <g transform="translate(245, 194) scale(0.72)">
      <rect x="0" y="0" width="145" height="20" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="72" y="14" fill="#0c1621" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">BUS MANTRA</text>
    </g>

    <!-- Front Fascia Details -->
    <path d="M 68 222 L 145 220 L 145 236 L 67 239 Z" fill="#1b2533"/>
    <rect x="80" y="225" width="50" height="4" rx="2" fill="#ec6103"/>
    <!-- LED Headlight -->
    <path d="M 66 210 L 88 208 L 86 222 L 66 224 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="68,212 84,210 83,219 68,220" fill="#fef08a"/>
    <circle cx="75" cy="214" r="3" fill="#ffffff"/>

    <!-- Front Bumper -->
    <path d="M 62 258 L 155 258 L 155 278 L 80 276 Q 62 274 62 258 Z" fill="#1b2533"/>

    <!-- Side Mirror -->
    <path d="M 88 95 Q 60 88 56 112 Q 54 135 64 160 L 70 160 Q 62 138 64 120 Q 66 102 92 108 Z" fill="#ec6103" stroke="#0c1621" stroke-width="1"/>
    <rect x="57" y="115" width="8" height="40" rx="3" fill="#1e293b"/>

    <!-- Door Line -->
    <line x1="175" y1="188" x2="175" y2="272" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="177" y="215" width="3.5" height="10" rx="1.5" fill="#64748b"/>

    <!-- Wheels (Front & Rear Dual) -->
    <!-- Front Wheel -->
    <path d="M 120 278 A 34 34 0 0 1 188 278 Z" fill="#0c1621"/>
    <circle cx="154" cy="278" r="30" fill="url(#goa-wheel)"/>
    <circle cx="154" cy="278" r="19" fill="#64748b"/>
    <circle cx="154" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="154" cy="278" r="5" fill="#ec6103"/>

    <!-- Rear Wheel 1 -->
    <path d="M 395 278 A 34 34 0 0 1 463 278 Z" fill="#0c1621"/>
    <circle cx="429" cy="278" r="30" fill="url(#goa-wheel)"/>
    <circle cx="429" cy="278" r="19" fill="#64748b"/>
    <circle cx="429" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="429" cy="278" r="5" fill="#ec6103"/>

    <!-- Rear Wheel 2 -->
    <path d="M 462 278 A 34 34 0 0 1 530 278 Z" fill="#0c1621"/>
    <circle cx="496" cy="278" r="30" fill="url(#goa-wheel)"/>
    <circle cx="496" cy="278" r="19" fill="#64748b"/>
    <circle cx="496" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="496" cy="278" r="5" fill="#ec6103"/>
  </g>
</svg>
