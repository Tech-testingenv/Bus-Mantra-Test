<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Background destination ambiance -->
    <radialGradient id="jp-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#fff7ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Soft ground shadow -->
    <radialGradient id="jp-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0c1621" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
    <!-- Coach body gradient -->
    <linearGradient id="jp-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="jp-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2f6"/>
    </linearGradient>
    <!-- Orange Livery -->
    <linearGradient id="jp-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <!-- Tinted Glass -->
    <linearGradient id="jp-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="jp-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="65%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </radialGradient>
  </defs>

  <!-- Ambient Sun Glow -->
  <circle cx="460" cy="110" r="100" fill="url(#jp-sun)"/>

  <!-- Subtle Minimalist Jaipur Palace / Fort Skyline (Background) -->
  <g opacity="0.38" fill="#fdba74">
    <!-- Hawa Mahal / Fort domes silhouette -->
    <!-- Far fort hill -->
    <path d="M 280 180 Q 360 140 450 150 Q 520 130 600 170 L 600 240 L 280 240 Z" fill="#ffedd5"/>
    <!-- Palace Pavilion & Domes -->
    <path d="M 330 145 Q 345 125 360 145 L 365 175 L 325 175 Z"/>
    <rect x="343" y="115" width="4" height="12" fill="#ea580c"/>
    <circle cx="345" cy="115" r="2.5" fill="#ea580c"/>
    <!-- Small Chatri Dome 1 -->
    <path d="M 380 140 Q 395 120 410 140 L 413 165 L 377 165 Z"/>
    <!-- Grand Palace Dome -->
    <path d="M 430 130 Q 455 100 480 130 L 485 165 L 425 165 Z" fill="#fb923c"/>
    <rect x="453" y="90" width="4" height="14" fill="#ea580c"/>
    <circle cx="455" cy="90" r="3" fill="#ea580c"/>
    <!-- Chatri Dome 2 -->
    <path d="M 500 138 Q 515 118 530 138 L 533 165 L 497 165 Z"/>
    <!-- Fort Wall Battlements -->
    <path d="M 310 175 L 560 175 L 560 190 L 310 190 Z" fill="#fed7aa"/>
    <rect x="330" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="350" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="370" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="390" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="410" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="470" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="490" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
    <rect x="510" y="170" width="8" height="6" fill="#ea580c" opacity="0.6"/>
  </g>

  <!-- Winding Tour Route / Road Vector -->
  <path d="M -20 340 Q 200 330 380 290 Q 480 268 560 215" fill="none" stroke="#e2e8f0" stroke-width="42" stroke-linecap="round"/>
  <path d="M -20 340 Q 200 330 380 290 Q 480 268 560 215" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Minimalist Jaipur Destination Location Pin -->
  <g transform="translate(485, 95) scale(0.9)">
    <circle cx="0" cy="0" r="14" fill="#ec6103" opacity="0.18"/>
    <path d="M 0 -18 C -7 -18 -12 -13 -12 -6 C -12 4 0 16 0 16 C 0 16 12 4 12 -6 C 12 -13 7 -18 0 -18 Z" fill="#ec6103"/>
    <circle cx="0" cy="-6" r="4.5" fill="#ffffff"/>
  </g>

  <!-- Soft Ground Shadow under Luxury Coach -->
  <ellipse cx="280" cy="318" rx="230" ry="20" fill="url(#jp-shadow)"/>
  <ellipse cx="270" cy="315" rx="190" ry="12" fill="#0c1621" opacity="0.18"/>

  <!-- LUXURY COACH BUS (Foreground) -->
  <g transform="translate(10, 0)">
    <!-- Aerodynamic Roof AC Unit -->
    <path d="M 180 82 L 420 82 Q 445 82 455 90 L 460 98 L 150 98 L 165 88 Q 170 82 180 82 Z" fill="#e2e7ef" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="200" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="250" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="300" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="350" y="87" width="35" height="5" rx="2.5" fill="#cbd3e0"/>

    <!-- Main Coach Body Side -->
    <path d="M 155 98 Q 170 98 190 98 L 515 98 Q 535 98 540 114 L 535 268 Q 535 278 525 278 L 155 278 L 130 264 L 130 114 Q 135 98 155 98 Z" fill="url(#jp-body)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Cap (3/4 Angled Face) -->
    <path d="M 75 152 Q 88 102 130 96 L 155 98 L 155 278 L 88 275 Q 68 273 66 245 L 72 170 Q 74 156 75 152 Z" fill="url(#jp-front)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Windshield -->
    <path d="M 78 146 Q 90 108 128 102 L 155 100 L 155 195 L 85 195 L 77 166 Q 77 152 78 146 Z" fill="url(#jp-glass)"/>
    <line x1="155" y1="142" x2="80" y2="142" stroke="#0c1621" stroke-width="2"/>
    <path d="M 92 110 L 125 104 L 110 190 L 85 190 Z" fill="#ffffff" opacity="0.12"/>
    <!-- Wipers -->
    <line x1="115" y1="192" x2="135" y2="152" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="192" x2="112" y2="156" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Panoramic Side Windows (Touring Luxury Coach) -->
    <path d="M 165 105 L 245 105 L 245 188 L 165 188 Z" fill="url(#jp-glass)"/>
    <path d="M 252 105 L 340 105 L 340 188 L 252 188 Z" fill="url(#jp-glass)"/>
    <path d="M 347 105 L 435 105 L 435 188 L 347 188 Z" fill="url(#jp-glass)"/>
    <path d="M 442 105 L 525 105 Q 533 105 533 118 L 528 188 L 442 188 Z" fill="url(#jp-glass)"/>

    <!-- Chrome Window Trim Lines -->
    <line x1="165" y1="103" x2="530" y2="103" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="165" y1="190" x2="530" y2="190" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Sheen reflections -->
    <polygon points="180,105 210,105 185,188 165,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="275,105 310,105 285,188 255,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="375,105 410,105 385,188 355,188" fill="#ffffff" opacity="0.1"/>
    <polygon points="470,105 505,105 480,188 450,188" fill="#ffffff" opacity="0.1"/>

    <!-- Brand Livery: Dynamic Bus Mantra Orange Swoosh -->
    <path d="M 70 224 Q 115 220 155 216 Q 235 208 315 228 Q 405 250 485 212 L 535 212 L 535 248 Q 445 282 360 254 Q 270 225 185 242 L 75 250 Z" fill="url(#jp-orange)"/>
    <path d="M 195 236 Q 275 222 365 252 Q 450 278 535 255 L 535 264 Q 450 286 365 261 Q 275 236 195 236 Z" fill="#0c1621" opacity="0.9"/>
    <!-- Small upper orange blade -->
    <path d="M 98 208 Q 130 205 155 208 L 155 213 Q 125 210 90 214 Z" fill="url(#jp-orange)"/>

    <!-- Luggage Bay Doors -->
    <rect x="225" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="245" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>
    <rect x="285" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="305" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>
    <rect x="345" y="242" width="50" height="28" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="365" y="245" width="12" height="3" rx="1.5" fill="#64748b"/>

    <!-- Bus Mantra Logo Stamp -->
    <g transform="translate(245, 194) scale(0.72)">
      <rect x="0" y="0" width="145" height="20" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="72" y="14" fill="#0c1621" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">BUS MANTRA</text>
    </g>

    <!-- Front Fascia Details -->
    <path d="M 68 222 L 145 220 L 145 236 L 67 239 Z" fill="#1b2533"/>
    <rect x="80" y="225" width="50" height="4" rx="2" fill="#ec6103"/>
    <!-- LED Headlight -->
    <path d="M 66 210 L 88 208 L 86 222 L 66 224 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="68,212 84,210 83,219 68,220" fill="#fef08a"/>
    <circle cx="75" cy="214" r="3" fill="#ffffff"/>

    <!-- Front Bumper -->
    <path d="M 62 258 L 155 258 L 155 278 L 80 276 Q 62 274 62 258 Z" fill="#1b2533"/>

    <!-- Side Mirror -->
    <path d="M 88 95 Q 60 88 56 112 Q 54 135 64 160 L 70 160 Q 62 138 64 120 Q 66 102 92 108 Z" fill="#ec6103" stroke="#0c1621" stroke-width="1"/>
    <rect x="57" y="115" width="8" height="40" rx="3" fill="#1e293b"/>

    <!-- Door Line -->
    <line x1="175" y1="188" x2="175" y2="272" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="177" y="215" width="3.5" height="10" rx="1.5" fill="#64748b"/>

    <!-- Wheels (Front & Rear) -->
    <!-- Front Wheel -->
    <path d="M 120 278 A 34 34 0 0 1 188 278 Z" fill="#0c1621"/>
    <circle cx="154" cy="278" r="30" fill="url(#jp-wheel)"/>
    <circle cx="154" cy="278" r="19" fill="#64748b"/>
    <circle cx="154" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="154" cy="278" r="5" fill="#ec6103"/>

    <!-- Rear Wheel 1 -->
    <path d="M 395 278 A 34 34 0 0 1 463 278 Z" fill="#0c1621"/>
    <circle cx="429" cy="278" r="30" fill="url(#jp-wheel)"/>
    <circle cx="429" cy="278" r="19" fill="#64748b"/>
    <circle cx="429" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="429" cy="278" r="5" fill="#ec6103"/>

    <!-- Rear Wheel 2 (Multi-Axle Luxury Coach) -->
    <path d="M 462 278 A 34 34 0 0 1 530 278 Z" fill="#0c1621"/>
    <circle cx="496" cy="278" r="30" fill="url(#jp-wheel)"/>
    <circle cx="496" cy="278" r="19" fill="#64748b"/>
    <circle cx="496" cy="278" r="12" fill="#cbd3e0"/>
    <circle cx="496" cy="278" r="5" fill="#ec6103"/>
  </g>
</svg>
