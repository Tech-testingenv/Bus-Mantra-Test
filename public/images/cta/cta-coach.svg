<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="100%" height="100%">
  <defs>
    <!-- Warm Orange Ambient Halo Glow -->
    <radialGradient id="cta-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ec6103" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#f97316" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>

    <!-- Headlight Beam Projection Flare -->
    <linearGradient id="headlight-beam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#fed7aa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="coach-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="coach-front-face" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- BUS MANTRA Signature Livery Orange Gradient -->
    <linearGradient id="coach-orange-streak" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Panoramic Tinted Glass -->
    <linearGradient id="coach-tint-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#060c14"/>
    </linearGradient>

    <!-- Wheel Rim Radial Gradient -->
    <radialGradient id="coach-wheel-rim" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>

    <!-- Ground Asphalt Shadow -->
    <radialGradient id="coach-ground-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Orange Energy Glow Behind Coach -->
  <ellipse cx="320" cy="200" rx="270" ry="160" fill="url(#cta-glow)"/>

  <!-- Subtle Decorative Route Lines & Location Pin (Behind Coach) -->
  <g opacity="0.6">
    <!-- Curved Highway Route Arc -->
    <path
      d="M 40 310 C 180 220, 320 280, 460 170 C 530 115, 590 140, 620 120"
      fill="none"
      stroke="#ec6103"
      stroke-width="2"
      stroke-dasharray="7 9"
    />
    <path
      d="M 80 340 C 220 270, 360 320, 500 220"
      fill="none"
      stroke="#ffffff"
      stroke-width="1.2"
      stroke-dasharray="4 6"
      opacity="0.3"
    />

    <!-- Waypoint Markers -->
    <circle cx="110" cy="285" r="3.5" fill="#ec6103"/>
    <circle cx="110" cy="285" r="8" fill="#ec6103" opacity="0.3"/>
    <circle cx="560" cy="130" r="3.5" fill="#ec6103"/>
    <circle cx="560" cy="130" r="8" fill="#ec6103" opacity="0.3"/>

    <!-- Luminous Destination Pin Marker (Top-Right) -->
    <g transform="translate(550, 80) scale(0.9)">
      <circle cx="12" cy="12" r="16" fill="#ec6103" opacity="0.2"/>
      <path
        d="M12 2C7.58 2 4 5.58 4 10c0 5.25 8 13 8 13s8-7.75 8-13c0-4.42-3.58-8-8-8zm0 11c-1.66 0-3-1.34-3-3s1.34-3 3-3 3 1.34 3 3-1.34 3-3 3z"
        fill="#ec6103"
      />
      <circle cx="12" cy="10" r="2.5" fill="#ffffff"/>
    </g>
  </g>

  <!-- Paved Roadway Perspective Surface -->
  <polygon points="20,380 620,380 580,315 80,315" fill="#0f172a" opacity="0.7"/>
  <line x1="160" y1="380" x2="220" y2="315" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.6"/>
  <line x1="480" y1="380" x2="440" y2="315" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.6"/>

  <!-- Headlight Beam Flare Casting Forward onto Road (Ahead of Coach) -->
  <polygon points="505,280 640,265 640,360 500,305" fill="url(#headlight-beam)"/>

  <!-- Ground Shadow under coach -->
  <ellipse cx="295" cy="346" rx="250" ry="22" fill="url(#coach-ground-shadow)"/>

  <!-- DEDICATED BUS MANTRA LUXURY COACH (Main Subject - Forward 3/4 Perspective) -->
  <g id="cta-bus-group">
    <!-- Coach Main Side Body Shell -->
    <path
      d="M 90 162 L 430 152 Q 470 152 486 168 L 512 235 Q 520 258 515 284 L 508 322 L 85 322 Q 76 322 76 308 L 78 178 Q 78 162 90 162 Z"
      fill="url(#coach-body-side)"
    />

    <!-- Front Nose 3/4 Aerodynamic Face -->
    <path
      d="M 430 152 Q 470 152 486 168 L 512 235 Q 520 258 515 284 L 508 322 L 468 322 L 460 258 L 430 152 Z"
      fill="url(#coach-front-face)"
      opacity="0.95"
    />

    <!-- Side Window Glass Ribbon -->
    <path d="M 105 172 L 425 165 L 458 234 L 458 245 L 105 245 Z" fill="url(#coach-tint-glass)"/>
    <!-- Individual Window Structural Dividers -->
    <line x1="160" y1="172" x2="160" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="215" y1="171" x2="215" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="270" y1="170" x2="270" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="325" y1="168" x2="325" y2="245" stroke="#334155" stroke-width="2"/>
    <line x1="380" y1="167" x2="380" y2="245" stroke="#334155" stroke-width="2"/>

    <!-- Comfortable Passenger Seat Headrests Silhouette -->
    <g fill="#475569" opacity="0.6">
      <rect x="122" y="188" width="18" height="25" rx="4"/>
      <rect x="177" y="188" width="18" height="25" rx="4"/>
      <rect x="232" y="188" width="18" height="25" rx="4"/>
      <rect x="287" y="188" width="18" height="25" rx="4"/>
      <rect x="342" y="188" width="18" height="25" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 425 165 Q 465 165 480 178 L 506 235 L 458 235 Z" fill="#070c14"/>
    <path d="M 432 170 Q 465 170 478 180 L 500 231 L 460 231 Z" fill="#0c1621"/>
    <!-- Windshield Reflection Highlight Streak -->
    <polygon points="445,170 460,170 488,231 472,231" fill="#ffffff" opacity="0.3"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path
      d="M 80 264 C 170 264, 275 255, 380 246 C 435 242, 475 250, 512 268 L 509 288 C 470 272, 425 266, 360 272 C 255 282, 160 285, 80 285 Z"
      fill="url(#coach-orange-streak)"
    />
    <path
      d="M 130 292 C 225 290, 330 282, 435 272 L 478 282 L 456 292 C 360 298, 245 300, 130 300 Z"
      fill="#0c1621"
    />

    <!-- "BUS MANTRA" Bold Brandmark on Coach Side -->
    <g transform="translate(195, 272)">
      <text
        x="0"
        y="0"
        font-family="system-ui, -apple-system, sans-serif"
        font-weight="900"
        font-size="12"
        fill="#ffffff"
        letter-spacing="2.5"
      >
        BUS MANTRA
      </text>
    </g>

    <!-- Lower Luggage Bays & Chrome Edge Line -->
    <line x1="95" y1="305" x2="400" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="150" y="306" width="65" height="2" fill="#ec6103"/>
    <rect x="245" y="306" width="65" height="2" fill="#ec6103"/>
    <rect x="340" y="306" width="55" height="2" fill="#ec6103"/>

    <!-- High-Performance LED Headlights (Glowing Crisp Projector) -->
    <polygon points="492,278 510,276 507,290 490,292" fill="#ffffff"/>
    <polygon points="494,280 508,278 505,287 492,289" fill="#38bdf8"/>
    <!-- Headlight Halo -->
    <circle cx="504" cy="283" r="6" fill="#fef08a" opacity="0.6"/>

    <!-- Front Aerodynamic Bumper & Fog Lights -->
    <path d="M 468 322 L 508 322 Q 514 316 515 298 L 462 298 Z" fill="#0f172a"/>
    <circle cx="500" cy="308" r="3.5" fill="#ea580c"/>
    <circle cx="500" cy="308" r="1.5" fill="#fef08a"/>

    <!-- WHEEL ASSEMBLIES (Detailed 3/4 Perspective Wheels) -->
    <!-- Rear Dual Wheel Set -->
    <g transform="translate(155, 322)">
      <circle cx="0" cy="0" r="27" fill="#020617"/>
      <!-- Wheel Arch -->
      <path d="M -31 -2 A 31 31 0 0 1 31 -2" fill="#000000"/>
      <!-- Dark Alloy Rim -->
      <circle cx="0" cy="0" r="17" fill="url(#coach-wheel-rim)"/>
      <circle cx="0" cy="0" r="9" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4.5" fill="#ec6103"/>
    </g>

    <!-- Front Steering Wheel Set -->
    <g transform="translate(442, 322)">
      <circle cx="0" cy="0" r="27" fill="#020617"/>
      <path d="M -31 -2 A 31 31 0 0 1 31 -2" fill="#000000"/>
      <circle cx="0" cy="0" r="17" fill="url(#coach-wheel-rim)"/>
      <circle cx="0" cy="0" r="9" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4.5" fill="#ec6103"/>
    </g>
  </g>

  <!-- Modern Aerodynamic Rooftop AC Pod -->
  <rect x="195" y="145" width="140" height="15" rx="5" fill="#e2e8f0"/>
  <rect x="215" y="149" width="32" height="6" rx="1.5" fill="#475569"/>
  <rect x="260" y="149" width="32" height="6" rx="1.5" fill="#475569"/>
</svg>
