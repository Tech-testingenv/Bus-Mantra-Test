<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Delhi Dusk/Evening Sky Gradient -->
    <linearGradient id="delhi-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Warm Amber Radial Glow -->
    <radialGradient id="delhi-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec6103" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#f97316" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Red / Yellow Sandstone Gradients (Dholpur Sandstone) -->
    <linearGradient id="sandstone-main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="35%" stop-color="#fdba74"/>
      <stop offset="70%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="sandstone-pillar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="60%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="sandstone-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>

    <!-- Portal Deep Shadow -->
    <linearGradient id="gate-portal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Eternal Flame Glow -->
    <radialGradient id="flame-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" rx="16" fill="url(#delhi-sky)"/>

  <!-- Amber Sun Glow -->
  <circle cx="300" cy="180" r="140" fill="url(#delhi-sun)"/>
  <circle cx="300" cy="180" r="50" fill="#ffffff" opacity="0.4"/>

  <!-- SUBTLE DELHI MODERN & HISTORIC SKYLINE SILHOUETTE (Background) -->
  <g opacity="0.32" fill="#94a3b8">
    <!-- Distant Highrises / Skyline (Left) -->
    <rect x="20" y="250" width="30" height="60" rx="1"/>
    <rect x="60" y="230" width="25" height="80" rx="1"/>
    <rect x="95" y="260" width="35" height="50" rx="1"/>
    <polygon points="72,215 72,230 74,230" stroke="#94a3b8" stroke-width="2"/>
    
    <!-- Qutub Minar Silhouette (Far Left) -->
    <polygon points="142,310 148,310 146,200 144,200" fill="#64748b"/>
    <rect x="141" y="235" width="8" height="2.5" fill="#475569"/>
    <rect x="142" y="265" width="8" height="2.5" fill="#475569"/>
    <line x1="145" y1="200" x2="145" y2="192" stroke="#64748b" stroke-width="1.5"/>

    <!-- Lotus Temple Silhouette (Far Right) -->
    <path d="M 440 310 Q 450 270 460 250 Q 470 270 480 310 Z" fill="#94a3b8"/>
    <path d="M 450 310 Q 460 260 470 240 Q 480 260 490 310 Z" fill="#64748b"/>
    <path d="M 460 310 Q 470 270 480 250 Q 490 270 500 310 Z" fill="#94a3b8"/>

    <!-- Distant Modern Metro/Highrises (Right) -->
    <rect x="515" y="240" width="28" height="70" rx="1"/>
    <rect x="550" y="220" width="35" height="90" rx="1"/>
    <line x1="567" y1="220" x2="567" y2="205" stroke="#94a3b8" stroke-width="1.5"/>
  </g>

  <!-- Decorative Travel Route Dotted Lines -->
  <path d="M 40 330 C 130 250, 240 210, 300 230 C 380 250, 480 190, 560 220" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45"/>
  <circle cx="85" cy="295" r="3" fill="#ec6103" opacity="0.6"/>
  <circle cx="515" cy="205" r="3" fill="#ec6103" opacity="0.6"/>

  <!-- Kartavya Path / Rajpath Boulevard Lawns & Pavement -->
  <!-- Lush Green Parkway Grounds -->
  <rect x="0" y="310" width="600" height="90" fill="#15803d" opacity="0.75"/>
  <polygon points="120,400 210,310 390,310 480,400" fill="#f1f5f9"/>
  <!-- Central Walkway Red Sandstone Trim -->
  <line x1="210" y1="310" x2="120" y2="400" stroke="#ea580c" stroke-width="3"/>
  <line x1="390" y1="310" x2="480" y2="400" stroke="#ea580c" stroke-width="3"/>

  <!-- Manicured Parkway Trees (Canopy Trees) -->
  <g fill="#166534">
    <ellipse cx="60" cy="300" rx="28" ry="18"/>
    <rect x="57" y="305" width="6" height="20" fill="#78350f"/>
    <ellipse cx="130" cy="305" rx="22" ry="15"/>
    <rect x="128" y="310" width="5" height="15" fill="#78350f"/>

    <ellipse cx="540" cy="300" rx="28" ry="18"/>
    <rect x="537" y="305" width="6" height="20" fill="#78350f"/>
    <ellipse cx="470" cy="305" rx="22" ry="15"/>
    <rect x="468" y="310" width="5" height="15" fill="#78350f"/>
  </g>

  <!-- INDIA GATE MONUMENT -->
  <!-- Base Pedestal & Steps -->
  <rect x="165" y="302" width="270" height="10" rx="2" fill="#ea580c"/>
  <rect x="180" y="294" width="240" height="8" rx="1" fill="#fdba74"/>

  <!-- Main Gate Lower Pillars (Left & Right Pylons) -->
  <!-- Left Pylon -->
  <rect x="195" y="150" width="62" height="144" fill="url(#sandstone-pillar)"/>
  <!-- Right Pylon -->
  <rect x="343" y="150" width="62" height="144" fill="url(#sandstone-pillar)"/>
  <!-- Outer Corner Pilaster Columns -->
  <rect x="190" y="155" width="10" height="135" fill="#fdba74"/>
  <rect x="400" y="155" width="10" height="135" fill="#f97316"/>

  <!-- Central Great Triumphal Archway -->
  <!-- Arch Portal Frame -->
  <path d="M 257 294 L 257 195 C 257 150, 343 150, 343 195 L 343 294 Z" fill="url(#gate-portal)"/>
  <!-- Inner Arch Recess & Shadow Contour -->
  <path d="M 264 294 L 264 198 C 264 162, 336 162, 336 198 L 336 294 Z" fill="#070d14"/>

  <!-- Left/Right Pylon Side Niches (Arched Relief Panels) -->
  <path d="M 210 240 L 210 200 Q 218 194 226 194 Q 234 194 234 200 L 234 240 Z" fill="#c2410c"/>
  <path d="M 366 240 L 366 200 Q 374 194 382 194 Q 390 194 390 200 L 390 240 Z" fill="#c2410c"/>

  <!-- Main Arch Keystone & Spandrel Ornament -->
  <circle cx="300" cy="168" r="4" fill="#ffedd5"/>
  <path d="M 295 168 L 300 158 L 305 168 Z" fill="#ffedd5"/>

  <!-- Cornice Above Arch -->
  <rect x="180" y="145" width="240" height="7" rx="1" fill="#ea580c"/>
  <rect x="175" y="140" width="250" height="5" rx="1" fill="#ffedd5"/>

  <!-- Upper Attic Story (Inscription Level) -->
  <rect x="185" y="95" width="230" height="45" rx="2" fill="url(#sandstone-main)"/>
  <rect x="195" y="103" width="210" height="28" fill="#c2410c" rx="1"/>

  <!-- "INDIA" Inscription Representation & Sunburst Medallion -->
  <g fill="#ffedd5" text-anchor="middle" font-family="sans-serif" font-weight="bold">
    <text x="300" y="122" font-size="12" letter-spacing="4">INDIA</text>
  </g>
  <!-- Year Inscriptions MCMXIV & MCMXIX subtle markers -->
  <rect x="205" y="113" width="20" height="2" fill="#fdba74" opacity="0.6"/>
  <rect x="375" y="113" width="20" height="2" fill="#fdba74" opacity="0.6"/>

  <!-- Top Crown Cornice & Shallow Domed Finial Bowl (Cenotaph Terrace) -->
  <rect x="178" y="88" width="244" height="7" rx="1" fill="#ea580c"/>
  <rect x="182" y="82" width="236" height="6" rx="1" fill="#ffedd5"/>
  <rect x="200" y="76" width="200" height="6" fill="#ea580c"/>
  <!-- Shallow Dome/Urn at Summit -->
  <ellipse cx="300" cy="74" rx="35" ry="6" fill="#ffedd5"/>
  <ellipse cx="300" cy="71" rx="20" ry="3.5" fill="#ec6103"/>

  <!-- AMAR JAWAN JYOTI CENOTAPH & ETERNAL FLAME (Inside Arch) -->
  <!-- Marble Pedestal Cenotaph -->
  <rect x="286" y="272" width="28" height="22" rx="1" fill="#0c1621" stroke="#f97316" stroke-width="1"/>
  <!-- Inverted Rifle with Soldier's Helmet Silhouette -->
  <line x1="300" y1="272" x2="300" y2="258" stroke="#ffffff" stroke-width="2"/>
  <ellipse cx="300" cy="256" rx="5" ry="3" fill="#ffffff"/>

  <!-- Eternal Flame (Immortal Soldier Fire) -->
  <circle cx="300" cy="250" r="14" fill="url(#flame-glow)"/>
  <path d="M 297 253 Q 300 242 303 253 Z" fill="#ffedd5"/>
  <circle cx="300" cy="250" r="2.5" fill="#f97316"/>

  <!-- Foreground Elegant Location Pin & Brand Accent -->
  <g transform="translate(300, 365)">
    <circle cx="0" cy="0" r="12" fill="#ec6103" opacity="0.2"/>
    <circle cx="0" cy="0" r="6" fill="#ec6103"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
