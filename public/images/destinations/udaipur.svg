<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Udaipur Morning Sky Gradient -->
    <linearGradient id="udaipur-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="45%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Royal Sun Glow -->
    <radialGradient id="udaipur-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#fff7ed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Palace Ivory / Marble Gradients -->
    <linearGradient id="palace-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="palace-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Lake Pichola Azure Water Gradient -->
    <linearGradient id="lake-pichola" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Mountain Hills Gradient -->
    <linearGradient id="aravalli-hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" rx="16" fill="url(#udaipur-sky)"/>

  <!-- Morning Sun -->
  <circle cx="210" cy="110" r="100" fill="url(#udaipur-sun)"/>
  <circle cx="210" cy="110" r="38" fill="#ffffff" opacity="0.6"/>

  <!-- Aravalli Hills Background Silhouette -->
  <path d="M 0 240 Q 110 160 220 185 Q 340 140 460 170 Q 540 150 600 180 L 600 270 L 0 270 Z" fill="url(#aravalli-hills)" opacity="0.55"/>
  <path d="M 160 200 Q 250 165 340 180 Q 420 160 500 190" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4"/>

  <!-- Decorative Travel Route Dotted Lines -->
  <path d="M 40 310 C 130 220, 220 200, 310 240 C 400 270, 490 200, 560 170" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45"/>
  <circle cx="80" cy="275" r="3" fill="#ec6103" opacity="0.7"/>
  <circle cx="510" cy="195" r="3" fill="#ec6103" opacity="0.7"/>

  <!-- UDAIPUR CITY PALACE ON THE LAKE SHORE (Elevated Massive Stone Facade) -->
  <!-- Palace Grand Base Bastion & Ghats -->
  <rect x="230" y="210" width="370" height="60" fill="url(#palace-shadow)"/>
  <!-- Ghat Staircases into Water -->
  <polygon points="210,270 250,230 270,230 250,270" fill="#94a3b8"/>
  <line x1="215" y1="265" x2="255" y2="265" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="225" y1="255" x2="260" y2="255" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- PALACE PAVILIONS & ARCHITECTURE -->
  <!-- Main Palace High Keep (Right Section) -->
  <rect x="420" y="100" width="160" height="120" rx="2" fill="url(#palace-white)"/>
  <rect x="415" y="130" width="170" height="4" fill="#cbd5e1"/>
  <!-- High Tower Chatris & Domes -->
  <!-- Tower 1 Dome (Far Right) -->
  <path d="M 535 100 C 530 85, 545 70, 560 68 C 575 70, 590 85, 585 100 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="560" y1="68" x2="560" y2="55" stroke="#ec6103" stroke-width="2"/>
  <circle cx="560" cy="55" r="2.5" fill="#ea580c"/>
  <!-- Tower 2 Dome (Mid Right) -->
  <path d="M 455 100 C 450 85, 465 72, 480 70 C 495 72, 510 85, 505 100 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="480" y1="70" x2="480" y2="58" stroke="#ec6103" stroke-width="2"/>
  <circle cx="480" cy="58" r="2.5" fill="#ea580c"/>

  <!-- Central Palace Pavilion (Manak Mahal & Zenana) -->
  <rect x="310" y="135" width="125" height="85" rx="2" fill="url(#palace-white)"/>
  <rect x="305" y="155" width="135" height="3" fill="#cbd5e1"/>
  <!-- Central Pavilion Fluted Domes & Chatris -->
  <path d="M 330 135 C 326 122, 338 110, 350 108 C 362 110, 374 122, 370 135 Z" fill="#ffffff"/>
  <line x1="350" y1="108" x2="350" y2="98" stroke="#ec6103" stroke-width="1.8"/>
  <path d="M 385 135 C 381 122, 393 110, 405 108 C 417 110, 429 122, 425 135 Z" fill="#ffffff"/>
  <line x1="405" y1="108" x2="405" y2="98" stroke="#ec6103" stroke-width="1.8"/>

  <!-- Left Palace Pavilion (Badi Mahal) -->
  <rect x="240" y="165" width="80" height="55" rx="2" fill="url(#palace-white)"/>
  <!-- Left Corner Chatri -->
  <path d="M 245 165 C 242 154, 252 144, 262 142 C 272 144, 282 154, 279 165 Z" fill="#ffffff"/>
  <line x1="262" y1="142" x2="262" y2="132" stroke="#ec6103" stroke-width="1.5"/>

  <!-- Palace Arches & Jharokha Balconies (Ornate Rajput details) -->
  <g fill="#0c1621">
    <!-- Arched Windows Row 1 -->
    <path d="M 440 120 L 440 108 Q 446 104 452 104 Q 458 104 458 108 L 458 120 Z"/>
    <path d="M 470 120 L 470 108 Q 476 104 482 104 Q 488 104 488 108 L 488 120 Z"/>
    <path d="M 500 120 L 500 108 Q 506 104 512 104 Q 518 104 518 108 L 518 120 Z"/>
    <path d="M 530 120 L 530 108 Q 536 104 542 104 Q 548 104 548 108 L 548 120 Z"/>

    <!-- Row 2 Arches -->
    <path d="M 330 150 L 330 140 Q 336 136 342 136 Q 348 136 348 140 L 348 150 Z"/>
    <path d="M 360 150 L 360 140 Q 366 136 372 136 Q 378 136 378 140 L 378 150 Z"/>
    <path d="M 390 150 L 390 140 Q 396 136 402 136 Q 408 136 408 140 L 408 150 Z"/>

    <!-- Lower Level Grand Arches -->
    <path d="M 260 195 L 260 180 Q 268 174 276 174 Q 284 174 284 180 L 284 195 Z"/>
    <path d="M 340 195 L 340 175 Q 350 168 360 168 Q 370 168 370 175 L 370 195 Z"/>
    <path d="M 390 195 L 390 175 Q 400 168 410 168 Q 420 168 420 175 L 420 195 Z"/>
    <path d="M 460 175 L 460 155 Q 470 148 480 148 Q 490 148 490 155 L 490 175 Z"/>
    <path d="M 520 175 L 520 155 Q 530 148 540 148 Q 550 148 550 155 L 550 175 Z"/>
  </g>

  <!-- Jharokha Balcony Projections (White with subtle shadow) -->
  <rect x="335" y="172" width="30" height="4" fill="#ec6103"/>
  <rect x="385" y="172" width="30" height="4" fill="#ec6103"/>
  <rect x="455" y="152" width="30" height="4" fill="#ec6103"/>
  <rect x="515" y="152" width="30" height="4" fill="#ec6103"/>

  <!-- LAKE PALACE / JAG MANDIR (Floating Island Palace on Far Left Lake) -->
  <g transform="translate(60, 230)">
    <!-- Island Platform Base -->
    <rect x="0" y="25" width="110" height="10" rx="1" fill="#cbd5e1"/>
    <!-- Island Palace Pavilion -->
    <rect x="15" y="10" width="80" height="16" fill="#ffffff"/>
    <!-- Central Cupola -->
    <path d="M 45 10 C 42 2, 50 -4, 55 -5 C 60 -4, 68 2, 65 10 Z" fill="#ffffff"/>
    <line x1="55" y1="-5" x2="55" y2="-12" stroke="#ec6103" stroke-width="1.5"/>
    <!-- Small Arches -->
    <rect x="25" y="14" width="8" height="12" rx="2" fill="#0c1621"/>
    <rect x="40" y="14" width="8" height="12" rx="2" fill="#0c1621"/>
    <rect x="62" y="14" width="8" height="12" rx="2" fill="#0c1621"/>
    <rect x="77" y="14" width="8" height="12" rx="2" fill="#0c1621"/>
  </g>

  <!-- CALM BLUE WATERS OF LAKE PICHOLA -->
  <rect x="0" y="265" width="600" height="135" fill="url(#lake-pichola)"/>

  <!-- SUBTLE PALACE REFLECTIONS IN LAKE WATER -->
  <g opacity="0.38">
    <!-- City Palace Reflection Shimmer (Right water area) -->
    <rect x="420" y="275" width="160" height="35" fill="#bae6fd" opacity="0.4"/>
    <line x1="430" y1="280" x2="570" y2="280" stroke="#ffffff" stroke-width="2"/>
    <line x1="450" y1="292" x2="550" y2="292" stroke="#ffffff" stroke-width="1.8"/>
    <line x1="440" y1="305" x2="560" y2="305" stroke="#fed7aa" stroke-width="1.5"/>
    <line x1="470" y1="320" x2="530" y2="320" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="480" y1="335" x2="520" y2="335" stroke="#ffffff" stroke-width="1.2"/>

    <!-- Central Pavilion Reflection -->
    <line x1="310" y1="275" x2="410" y2="275" stroke="#ffffff" stroke-width="2"/>
    <line x1="325" y1="288" x2="395" y2="288" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="340" y1="302" x2="380" y2="302" stroke="#fed7aa" stroke-width="1.5"/>

    <!-- Island Palace Reflection (Left water area) -->
    <line x1="75" y1="275" x2="155" y2="275" stroke="#ffffff" stroke-width="2"/>
    <line x1="85" y1="285" x2="145" y2="285" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="100" y1="295" x2="130" y2="295" stroke="#ffffff" stroke-width="1.2"/>
  </g>

  <!-- Lake Water Surface Gentle Wavelets -->
  <path d="M 20 340 Q 100 334 180 340 Q 260 346 340 340 Q 420 334 500 340 Q 550 344 600 340" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>
  <path d="M 60 365 Q 160 358 260 365 Q 360 372 460 365 Q 530 360 600 365" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.5"/>
  <path d="M 0 385 Q 120 378 240 385 Q 360 392 480 385 Q 540 380 600 385" fill="none" stroke="#bae6fd" stroke-width="2" opacity="0.4"/>

  <!-- Royal Shikara / Heritage Boat on the Lake -->
  <g transform="translate(180, 310) scale(0.85)">
    <!-- Boat Hull -->
    <path d="M 0 20 Q 25 24 55 20 Q 60 14 62 10 Q 30 14 0 10 Z" fill="#0c1621"/>
    <!-- Canopy (Chatri tent) -->
    <path d="M 18 10 L 22 2 L 40 2 L 44 10 Z" fill="#ec6103"/>
    <line x1="22" y1="2" x2="22" y2="10" stroke="#ffffff" stroke-width="1"/>
    <line x1="40" y1="2" x2="40" y2="10" stroke="#ffffff" stroke-width="1"/>
    <!-- Water ripple under boat -->
    <path d="M -8 24 Q 28 27 68 24" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Elegant Location Marker & Brand Accent -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="12" fill="#ec6103" opacity="0.2"/>
    <circle cx="0" cy="0" r="6" fill="#ec6103"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
