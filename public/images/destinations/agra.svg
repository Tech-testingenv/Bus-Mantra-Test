<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Sky Gradient -->
    <linearGradient id="agra-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="60%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Morning Sun Glow -->
    <radialGradient id="agra-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec6103" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Marble Gradients -->
    <linearGradient id="marble-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="marble-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="arch-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Water Reflection Gradient -->
    <linearGradient id="water-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" rx="16" fill="url(#agra-sky)"/>

  <!-- Morning Sun -->
  <circle cx="300" cy="180" r="140" fill="url(#agra-sun)"/>
  <circle cx="300" cy="180" r="50" fill="#ffffff" opacity="0.6"/>

  <!-- Subtle Decorative Travel Route Arcs -->
  <path d="M 40 320 C 140 240, 220 180, 300 200 C 380 220, 480 160, 560 210" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.4"/>
  <circle cx="80" cy="285" r="3" fill="#ec6103" opacity="0.6"/>
  <circle cx="520" cy="185" r="3" fill="#ec6103" opacity="0.6"/>

  <!-- Distant Yamuna River & Landscape Horizon -->
  <path d="M 0 310 Q 150 295 300 300 Q 450 305 600 295 L 600 340 L 0 340 Z" fill="#fdba74" opacity="0.35"/>

  <!-- Main Marble Plinth Platform -->
  <rect x="110" y="275" width="380" height="18" rx="2" fill="url(#marble-base)"/>
  <rect x="95" y="291" width="410" height="12" rx="2" fill="#e2e8f0"/>
  <line x1="95" y1="291" x2="505" y2="291" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- TAJ MAHAL MAIN MAUSOLEUM -->
  <!-- Central Tomb Body -->
  <rect x="200" y="165" width="200" height="110" fill="url(#marble-base)"/>
  <!-- Chamfered corners (Left & Right Wings) -->
  <path d="M 180 275 L 180 180 L 205 165 L 205 275 Z" fill="#f1f5f9"/>
  <path d="M 420 275 L 420 180 L 395 165 L 395 275 Z" fill="#cbd5e1"/>

  <!-- Grand Central Iwan (Arch Portal) -->
  <rect x="240" y="150" width="120" height="125" rx="2" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Arch Frame Molding -->
  <path d="M 252 275 L 252 195 Q 252 165 300 162 Q 348 165 348 195 L 348 275 Z" fill="url(#arch-depth)"/>
  <!-- Inner Arch Recess & Doorway -->
  <path d="M 264 275 L 264 210 Q 264 185 300 182 Q 336 185 336 210 L 336 275 Z" fill="#070d14"/>
  <!-- Jali lattice pattern hint -->
  <line x1="280" y1="275" x2="280" y2="215" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>
  <line x1="300" y1="275" x2="300" y2="200" stroke="#ec6103" stroke-width="1" opacity="0.6"/>
  <line x1="320" y1="275" x2="320" y2="215" stroke="#334155" stroke-width="1" stroke-dasharray="2 3"/>

  <!-- Left Side Small Arches (Two levels) -->
  <path d="M 212 215 L 212 185 Q 212 173 226 173 Q 240 173 240 185 L 240 215 Z" fill="#1e293b"/>
  <path d="M 212 265 L 212 235 Q 212 223 226 223 Q 240 223 240 235 L 240 265 Z" fill="#1e293b"/>
  <!-- Right Side Small Arches (Two levels) -->
  <path d="M 360 215 L 360 185 Q 360 173 374 173 Q 388 173 388 185 L 388 215 Z" fill="#1e293b"/>
  <path d="M 360 265 L 360 235 Q 360 223 374 223 Q 388 223 388 235 L 388 265 Z" fill="#1e293b"/>

  <!-- Left Chamfer Arches -->
  <path d="M 188 215 L 188 190 Q 188 180 196 180 Q 204 180 204 190 L 204 215 Z" fill="#334155"/>
  <path d="M 188 265 L 188 240 Q 188 230 196 230 Q 204 230 204 240 L 204 265 Z" fill="#334155"/>
  <!-- Right Chamfer Arches -->
  <path d="M 396 215 L 396 190 Q 396 180 404 180 Q 412 180 412 190 L 412 215 Z" fill="#334155"/>
  <path d="M 396 265 L 396 240 Q 396 230 404 230 Q 412 230 412 240 L 412 265 Z" fill="#334155"/>

  <!-- Central Grand Dome -->
  <!-- Dome Drum Base -->
  <rect x="265" y="130" width="70" height="22" rx="1" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Bulbous Onion Dome -->
  <path d="M 265 132 C 240 105, 252 65, 300 55 C 348 65, 360 105, 335 132 Z" fill="url(#marble-base)"/>
  <!-- Dome Shadow / Shading Curve -->
  <path d="M 300 55 C 340 68, 355 105, 335 132 L 300 132 Z" fill="#e2e8f0" opacity="0.6"/>
  <!-- Lotus Finial (Kalash / Spire) -->
  <path d="M 296 55 L 300 48 L 304 55 Z" fill="#ec6103"/>
  <line x1="300" y1="48" x2="300" y2="28" stroke="#ec6103" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="38" r="3" fill="#ea580c"/>
  <circle cx="300" cy="28" r="2" fill="#ea580c"/>

  <!-- Left Secondary Dome (Chatri) -->
  <rect x="216" y="145" width="22" height="6" fill="#f1f5f9"/>
  <path d="M 215 145 C 205 132, 212 118, 227 115 C 242 118, 249 132, 239 145 Z" fill="url(#marble-base)"/>
  <line x1="227" y1="115" x2="227" y2="104" stroke="#ec6103" stroke-width="1.8"/>

  <!-- Right Secondary Dome (Chatri) -->
  <rect x="362" y="145" width="22" height="6" fill="#cbd5e1"/>
  <path d="M 361 145 C 351 132, 358 118, 373 115 C 388 118, 395 132, 385 145 Z" fill="url(#marble-base)"/>
  <line x1="373" y1="115" x2="373" y2="104" stroke="#ec6103" stroke-width="1.8"/>

  <!-- FOUR MINARETS (Outward Lean Architectural Accuracy) -->
  <!-- Far Left Minaret -->
  <g id="minaret-left">
    <!-- Base Plinth -->
    <polygon points="120,291 138,291 136,275 122,275" fill="#e2e8f0"/>
    <!-- Lower Tier -->
    <polygon points="123,275 135,275 133,215 125,215" fill="url(#marble-base)"/>
    <!-- 1st Balcony -->
    <rect x="120" y="213" width="18" height="4" rx="1" fill="#cbd5e1"/>
    <!-- Middle Tier -->
    <polygon points="124,213 134,213 133,165 125,165" fill="url(#marble-base)"/>
    <!-- 2nd Balcony -->
    <rect x="121" y="163" width="16" height="4" rx="1" fill="#cbd5e1"/>
    <!-- Upper Tier -->
    <polygon points="125,163 133,163 132,125 126,125" fill="url(#marble-base)"/>
    <!-- Top Cupola Chatri -->
    <rect x="122" y="122" width="14" height="4" fill="#cbd5e1"/>
    <path d="M 122 122 C 119 114, 123 106, 129 104 C 135 106, 139 114, 136 122 Z" fill="#ffffff"/>
    <line x1="129" y1="104" x2="129" y2="95" stroke="#ec6103" stroke-width="1.5"/>
  </g>

  <!-- Inner Left Minaret (Smaller perspective) -->
  <g transform="translate(42, 6) scale(0.95)">
    <polygon points="120,291 138,291 136,275 122,275" fill="#cbd5e1"/>
    <polygon points="123,275 135,275 133,215 125,215" fill="#f1f5f9"/>
    <rect x="120" y="213" width="18" height="4" rx="1" fill="#cbd5e1"/>
    <polygon points="124,213 134,213 133,165 125,165" fill="#f1f5f9"/>
    <rect x="121" y="163" width="16" height="4" rx="1" fill="#cbd5e1"/>
    <polygon points="125,163 133,163 132,125 126,125" fill="#f1f5f9"/>
    <rect x="122" y="122" width="14" height="4" fill="#cbd5e1"/>
    <path d="M 122 122 C 119 114, 123 106, 129 104 C 135 106, 139 114, 136 122 Z" fill="#f8fafc"/>
    <line x1="129" y1="104" x2="129" y2="95" stroke="#ec6103" stroke-width="1.5"/>
  </g>

  <!-- Far Right Minaret -->
  <g id="minaret-right">
    <!-- Base Plinth -->
    <polygon points="462,291 480,291 478,275 464,275" fill="#cbd5e1"/>
    <!-- Lower Tier -->
    <polygon points="465,275 477,275 475,215 467,215" fill="url(#marble-base)"/>
    <!-- 1st Balcony -->
    <rect x="462" y="213" width="18" height="4" rx="1" fill="#94a3b8"/>
    <!-- Middle Tier -->
    <polygon points="466,213 476,213 475,165 467,165" fill="url(#marble-base)"/>
    <!-- 2nd Balcony -->
    <rect x="463" y="163" width="16" height="4" rx="1" fill="#94a3b8"/>
    <!-- Upper Tier -->
    <polygon points="467,163 475,163 474,125 468,125" fill="url(#marble-base)"/>
    <!-- Top Cupola Chatri -->
    <rect x="464" y="122" width="14" height="4" fill="#94a3b8"/>
    <path d="M 464 122 C 461 114, 465 106, 471 104 C 477 106, 481 114, 478 122 Z" fill="#f1f5f9"/>
    <line x1="471" y1="104" x2="471" y2="95" stroke="#ec6103" stroke-width="1.5"/>
  </g>

  <!-- Inner Right Minaret (Smaller perspective) -->
  <g transform="translate(268, 6) scale(0.95)">
    <polygon points="180,291 198,291 196,275 182,275" fill="#cbd5e1"/>
    <polygon points="183,275 195,275 193,215 185,215" fill="#e2e8f0"/>
    <rect x="180" y="213" width="18" height="4" rx="1" fill="#94a3b8"/>
    <polygon points="184,213 194,213 193,165 185,165" fill="#e2e8f0"/>
    <rect x="181" y="163" width="16" height="4" rx="1" fill="#94a3b8"/>
    <polygon points="185,163 193,163 192,125 186,125" fill="#e2e8f0"/>
    <rect x="182" y="122" width="14" height="4" fill="#94a3b8"/>
    <path d="M 182 122 C 179 114, 183 106, 189 104 C 195 106, 199 114, 196 122 Z" fill="#e2e8f0"/>
    <line x1="189" y1="104" x2="189" y2="95" stroke="#ec6103" stroke-width="1.5"/>
  </g>

  <!-- Forecourt Garden & Reflecting Pool (Charbagh) -->
  <!-- Green Lawn Borders -->
  <polygon points="0,400 95,303 180,303 140,400" fill="#15803d" opacity="0.6"/>
  <polygon points="600,400 505,303 420,303 460,400" fill="#15803d" opacity="0.6"/>

  <!-- Water Channel (Reflecting Pool) -->
  <polygon points="215,303 385,303 450,400 150,400" fill="url(#water-grad)"/>

  <!-- Subtle Inverted Shimmer Reflection of Taj Mahal Dome in Pool -->
  <g opacity="0.35">
    <!-- Inverted dome reflection -->
    <ellipse cx="300" cy="335" rx="26" ry="12" fill="#ffffff"/>
    <line x1="260" y1="335" x2="340" y2="335" stroke="#ffffff" stroke-width="2"/>
    <line x1="275" y1="345" x2="325" y2="345" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="285" y1="355" x2="315" y2="355" stroke="#ec6103" stroke-width="1.5"/>
    <!-- Water ripples -->
    <path d="M 230 365 Q 300 362 370 365" stroke="#ffffff" stroke-width="1.5" fill="none" opacity="0.6"/>
    <path d="M 200 382 Q 300 379 400 382" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <!-- Elegant Location Marker & Brand Accent -->
  <g transform="translate(300, 312)">
    <circle cx="0" cy="0" r="10" fill="#ec6103" opacity="0.2"/>
    <circle cx="0" cy="0" r="5" fill="#ec6103"/>
    <circle cx="0" cy="0" r="2" fill="#ffffff"/>
  </g>
</svg>
