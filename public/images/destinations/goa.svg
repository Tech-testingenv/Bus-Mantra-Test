<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Tropical Coastal Sunset Sky Gradient -->
    <linearGradient id="goa-dest-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="40%" stop-color="#fed7aa"/>
      <stop offset="75%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <!-- Warm Golden Sun Glow -->
    <radialGradient id="goa-dest-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fed7aa"/>
      <stop offset="70%" stop-color="#ea580c" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>

    <!-- Sea Waves Gradients -->
    <linearGradient id="sea-deep" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="sea-surf" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="sand-beach" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>

    <!-- Palm Frond Gradients -->
    <linearGradient id="palm-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" rx="16" fill="url(#goa-dest-sky)"/>

  <!-- Golden Sunset Sun -->
  <circle cx="300" cy="190" r="130" fill="url(#goa-dest-sun)"/>
  <circle cx="300" cy="190" r="48" fill="#ffffff" opacity="0.9"/>
  <!-- Sun Reflection Band across Horizon -->
  <ellipse cx="300" cy="225" rx="70" ry="4" fill="#ffffff" opacity="0.7"/>
  <ellipse cx="300" cy="235" rx="55" ry="3" fill="#ffffff" opacity="0.6"/>

  <!-- Distant Headland / Coastal Cliff Silhouette (Cabo de Rama / Aguada) -->
  <path d="M 0 220 Q 90 205 160 215 L 180 230 L 0 230 Z" fill="#9a3412" opacity="0.45"/>
  <path d="M 450 225 Q 520 205 600 215 L 600 230 L 450 230 Z" fill="#9a3412" opacity="0.35"/>

  <!-- Distant Goan Sailboat Silhouette -->
  <g transform="translate(380, 185) scale(0.7)" opacity="0.7">
    <!-- Boat Hull -->
    <path d="M 0 35 Q 20 40 45 35 Q 35 48 10 48 Z" fill="#0c1621"/>
    <!-- Main Sail -->
    <path d="M 22 5 L 22 34 L 42 34 Z" fill="#ffffff"/>
    <!-- Fore Sail -->
    <path d="M 18 10 L 18 34 L 4 34 Z" fill="#ffedd5"/>
  </g>

  <!-- Decorative Travel Route Dotted Lines -->
  <path d="M 30 260 C 120 180, 220 250, 320 190 C 420 130, 520 220, 570 180" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45"/>
  <circle cx="80" cy="225" r="3" fill="#ec6103" opacity="0.7"/>
  <circle cx="480" cy="170" r="3" fill="#ec6103" opacity="0.7"/>

  <!-- ARABIAN SEA - LAYERED COASTAL WAVES -->
  <!-- Deep Horizon Water -->
  <rect x="0" y="225" width="600" height="25" fill="url(#sea-deep)"/>

  <!-- Mid Wave Layer 1 -->
  <path d="M 0 240 Q 60 232 120 240 Q 180 248 240 240 Q 300 232 360 240 Q 420 248 480 240 Q 540 232 600 240 L 600 265 L 0 265 Z" fill="url(#sea-surf)"/>
  <!-- White Foam Crest 1 -->
  <path d="M 0 240 Q 60 232 120 240 Q 180 248 240 240 Q 300 232 360 240 Q 420 248 480 240 Q 540 232 600 240" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>

  <!-- Mid Wave Layer 2 -->
  <path d="M 0 260 Q 75 250 150 260 Q 225 270 300 260 Q 375 250 450 260 Q 525 270 600 260 L 600 290 L 0 290 Z" fill="#0284c7"/>
  <!-- White Foam Crest 2 -->
  <path d="M 0 260 Q 75 250 150 260 Q 225 270 300 260 Q 375 250 450 260 Q 525 270 600 260" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.85"/>

  <!-- Inshore Surf & Gentle Rolling Breaker -->
  <path d="M 0 285 Q 90 272 180 285 Q 270 298 360 285 Q 450 272 540 285 Q 570 292 600 285 L 600 325 L 0 325 Z" fill="#38bdf8"/>
  <path d="M 0 285 Q 90 272 180 285 Q 270 298 360 285 Q 450 272 540 285 Q 570 292 600 285" fill="none" stroke="#ffffff" stroke-width="3"/>

  <!-- Wet Sand Shoreline (Tide Wash) -->
  <path d="M 0 315 Q 120 300 240 315 Q 360 330 480 315 Q 540 308 600 315 L 600 345 L 0 345 Z" fill="#fed7aa" opacity="0.8"/>
  <!-- Gentle foam line on sand -->
  <path d="M 0 315 Q 120 300 240 315 Q 360 330 480 315 Q 540 308 600 315" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.7"/>

  <!-- GOLDEN SANDY BEACH FOREGROUND -->
  <path d="M 0 335 Q 150 320 300 335 Q 450 350 600 335 L 600 400 L 0 400 Z" fill="url(#sand-beach)"/>
  <!-- Beach Sand Textures / Gentle Dune Ribbons -->
  <path d="M 40 365 Q 180 355 320 368" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.6"/>
  <path d="M 280 380 Q 420 370 560 382" fill="none" stroke="#fcd34d" stroke-width="2" opacity="0.6"/>

  <!-- TROPICAL COCONUT PALM TREES (Signature Goa Beachscape) -->
  <!-- LEFT PALM GROVE (Swaying gracefully) -->
  <g>
    <!-- Palm 1 Trunk (Curved) -->
    <path d="M -10 390 Q 60 280 90 120" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
    <path d="M -10 390 Q 60 280 90 120" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <!-- Palm 1 Fronds (Canopy) -->
    <!-- Crown core -->
    <circle cx="90" cy="120" r="6" fill="#14532d"/>
    <!-- Frond 1 (Top Left) -->
    <path d="M 90 120 Q 30 90 10 130" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 90 120 Q 40 70 30 110" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <!-- Frond 2 (Top) -->
    <path d="M 90 120 Q 90 50 110 80" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <!-- Frond 3 (Right high) -->
    <path d="M 90 120 Q 150 70 170 110" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 90 120 Q 140 100 180 135" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <!-- Frond 4 (Right low drooping) -->
    <path d="M 90 120 Q 150 140 160 170" fill="none" stroke="url(#palm-leaf)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Frond 5 (Left drooping) -->
    <path d="M 90 120 Q 40 140 30 175" fill="none" stroke="url(#palm-leaf)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Palm 2 (Smaller leaning trunk) -->
    <path d="M -20 380 Q 20 290 35 180" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <!-- Fronds -->
    <path d="M 35 180 Q -10 150 -15 190" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 180 Q 35 130 50 160" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 35 180 Q 80 150 90 190" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- RIGHT PALM GROVE (Swaying inward) -->
  <g>
    <!-- Palm 3 Trunk -->
    <path d="M 610 390 Q 540 270 510 110" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round"/>
    <path d="M 610 390 Q 540 270 510 110" fill="none" stroke="#b45309" stroke-width="6" stroke-linecap="round"/>
    <!-- Fronds -->
    <circle cx="510" cy="110" r="6" fill="#14532d"/>
    <!-- Frond Left high -->
    <path d="M 510 110 Q 450 60 430 100" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <path d="M 510 110 Q 440 90 410 130" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    <!-- Frond Top -->
    <path d="M 510 110 Q 510 40 490 70" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <!-- Frond Right high -->
    <path d="M 510 110 Q 570 60 590 100" fill="none" stroke="url(#palm-leaf)" stroke-width="5" stroke-linecap="round"/>
    <!-- Fronds drooping -->
    <path d="M 510 110 Q 450 140 440 175" fill="none" stroke="url(#palm-leaf)" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 510 110 Q 560 140 570 175" fill="none" stroke="url(#palm-leaf)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Palm 4 (Leaning inwards) -->
    <path d="M 630 380 Q 580 290 565 170" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round"/>
    <path d="M 565 170 Q 520 140 510 180" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 565 170 Q 570 120 550 150" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    <path d="M 565 170 Q 610 140 615 180" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Elegant Location Marker & Brand Accent -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="12" fill="#ec6103" opacity="0.2"/>
    <circle cx="0" cy="0" r="6" fill="#ec6103"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
