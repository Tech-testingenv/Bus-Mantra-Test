<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Jaipur Warm Sky Gradient -->
    <linearGradient id="jp-dest-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="60%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>

    <!-- Warm Morning Amber Glow -->
    <radialGradient id="jp-dest-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec6103" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#f97316" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Terracotta / Pink City Sandstone Gradients -->
    <linearGradient id="pink-stone-main" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="pink-stone-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fda4af"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="pink-stone-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="window-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="400" rx="16" fill="url(#jp-dest-sky)"/>

  <!-- Morning Sun -->
  <circle cx="440" cy="140" r="130" fill="url(#jp-dest-sun)"/>
  <circle cx="440" cy="140" r="45" fill="#ffffff" opacity="0.5"/>

  <!-- Distant Nahargarh / Aravalli Hills Silhouette -->
  <path d="M 0 310 Q 120 270 260 285 Q 400 260 600 290 L 600 360 L 0 360 Z" fill="#fda4af" opacity="0.4"/>
  <path d="M 280 275 L 300 265 L 340 268 L 360 278" fill="none" stroke="#e11d48" stroke-width="2" opacity="0.4"/>

  <!-- Decorative Route Arc -->
  <path d="M 50 330 C 160 260, 260 220, 360 230 C 460 240, 520 180, 560 210" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.45"/>
  <circle cx="90" cy="305" r="3" fill="#ec6103" opacity="0.7"/>
  <circle cx="530" cy="195" r="3" fill="#ec6103" opacity="0.7"/>

  <!-- HAWA MAHAL (PALACE OF WINDS) FAÇADE -->
  <!-- Base Ground Terrace -->
  <rect x="120" y="320" width="360" height="45" rx="3" fill="url(#pink-stone-dark)"/>
  <rect x="100" y="340" width="400" height="25" rx="2" fill="#be123c"/>
  <line x1="100" y1="340" x2="500" y2="340" stroke="#fda4af" stroke-width="1.5"/>

  <!-- Ground Tier Arch Gateways -->
  <g fill="url(#window-depth)">
    <path d="M 160 340 L 160 325 Q 160 318 175 318 Q 190 318 190 325 L 190 340 Z"/>
    <path d="M 220 340 L 220 322 Q 220 315 235 315 Q 250 315 250 322 L 250 340 Z"/>
    <path d="M 285 340 L 285 318 Q 285 310 300 310 Q 315 310 315 318 L 315 340 Z"/>
    <path d="M 350 340 L 350 322 Q 350 315 365 315 Q 380 315 380 322 L 380 340 Z"/>
    <path d="M 410 340 L 410 325 Q 410 318 425 318 Q 440 318 440 325 L 440 340 Z"/>
  </g>

  <!-- TIER 1 (Widest) -->
  <rect x="140" y="270" width="320" height="50" rx="3" fill="url(#pink-stone-main)"/>
  <!-- Tier 1 Cornice -->
  <rect x="135" y="267" width="330" height="4" fill="#fda4af"/>
  <!-- 5 Bay Windows (Jharokhas) -->
  <g fill="#ffffff">
    <!-- Window 1 -->
    <path d="M 160 308 L 160 280 Q 170 274 180 280 L 180 308 Z" fill="url(#window-depth)"/>
    <path d="M 158 280 Q 170 268 182 280 Z" fill="#fda4af"/>
    <!-- Window 2 -->
    <path d="M 220 308 L 220 280 Q 230 274 240 280 L 240 308 Z" fill="url(#window-depth)"/>
    <path d="M 218 280 Q 230 268 242 280 Z" fill="#fda4af"/>
    <!-- Central Grand Window 3 -->
    <path d="M 285 308 L 285 278 Q 300 270 315 278 L 315 308 Z" fill="url(#window-depth)"/>
    <path d="M 282 278 Q 300 264 318 278 Z" fill="#fda4af"/>
    <circle cx="300" cy="273" r="3" fill="#ec6103"/>
    <!-- Window 4 -->
    <path d="M 360 308 L 360 280 Q 370 274 380 280 L 380 308 Z" fill="url(#window-depth)"/>
    <path d="M 358 280 Q 370 268 382 280 Z" fill="#fda4af"/>
    <!-- Window 5 -->
    <path d="M 420 308 L 420 280 Q 430 274 440 280 L 440 308 Z" fill="url(#window-depth)"/>
    <path d="M 418 280 Q 430 268 442 280 Z" fill="#fda4af"/>
  </g>

  <!-- TIER 2 (Slightly narrower) -->
  <rect x="170" y="215" width="260" height="52" rx="3" fill="url(#pink-stone-main)"/>
  <!-- Cornice -->
  <rect x="165" y="212" width="270" height="4" fill="#fda4af"/>
  <!-- 4 Bay Windows -->
  <g fill="url(#window-depth)">
    <path d="M 190 252 L 190 226 Q 200 220 210 226 L 210 252 Z"/>
    <path d="M 245 252 L 245 226 Q 255 220 265 226 L 265 252 Z"/>
    <path d="M 335 252 L 335 226 Q 345 220 355 226 L 355 252 Z"/>
    <path d="M 390 252 L 390 226 Q 400 220 410 226 L 410 252 Z"/>
  </g>
  <!-- Window Mini Domes -->
  <path d="M 188 226 Q 200 215 212 226 Z" fill="#fda4af"/>
  <path d="M 243 226 Q 255 215 267 226 Z" fill="#fda4af"/>
  <path d="M 333 226 Q 345 215 357 226 Z" fill="#fda4af"/>
  <path d="M 388 226 Q 400 215 412 226 Z" fill="#fda4af"/>
  <!-- Center Accent Arch on Tier 2 -->
  <path d="M 288 252 L 288 224 Q 300 218 312 224 L 312 252 Z" fill="url(#window-depth)"/>
  <path d="M 285 224 Q 300 210 315 224 Z" fill="#fda4af"/>
  <circle cx="300" cy="217" r="2.5" fill="#ec6103"/>

  <!-- TIER 3 (Pyramid step up) -->
  <rect x="205" y="160" width="190" height="52" rx="3" fill="url(#pink-stone-main)"/>
  <!-- Cornice -->
  <rect x="200" y="157" width="200" height="4" fill="#fda4af"/>
  <!-- 3 Bay Windows -->
  <g fill="url(#window-depth)">
    <path d="M 225 198 L 225 172 Q 235 166 245 172 L 245 198 Z"/>
    <path d="M 285 198 L 285 170 Q 300 162 315 170 L 315 198 Z"/>
    <path d="M 355 198 L 355 172 Q 365 166 375 172 L 375 198 Z"/>
  </g>
  <!-- Window Mini Domes -->
  <path d="M 223 172 Q 235 160 247 172 Z" fill="#fda4af"/>
  <path d="M 282 170 Q 300 156 318 170 Z" fill="#fda4af"/>
  <path d="M 353 172 Q 365 160 377 172 Z" fill="#fda4af"/>

  <!-- TIER 4 (Upper Level) -->
  <rect x="240" y="110" width="120" height="47" rx="3" fill="url(#pink-stone-main)"/>
  <!-- Cornice -->
  <rect x="235" y="108" width="130" height="3" fill="#fda4af"/>
  <!-- 2 Jharokhas -->
  <path d="M 260 144 L 260 122 Q 270 116 280 122 L 280 144 Z" fill="url(#window-depth)"/>
  <path d="M 258 122 Q 270 112 282 122 Z" fill="#fda4af"/>
  <path d="M 320 144 L 320 122 Q 330 116 340 122 L 340 144 Z" fill="url(#window-depth)"/>
  <path d="M 318 122 Q 330 112 342 122 Z" fill="#fda4af"/>

  <!-- TIER 5 (TOPMOST CREST & CHATRI PAVILION) -->
  <rect x="270" y="75" width="60" height="33" rx="2" fill="url(#pink-stone-light)"/>
  <!-- Topmost Arched Window -->
  <path d="M 288 98 L 288 84 Q 300 78 312 84 L 312 98 Z" fill="url(#window-depth)"/>
  <!-- Golden / Brass Kalash Finial Domes -->
  <!-- Center Main Dome Crest -->
  <path d="M 270 75 Q 300 50 330 75 Z" fill="#f43f5e"/>
  <path d="M 285 58 Q 300 45 315 58 Z" fill="#fda4af"/>
  <line x1="300" y1="46" x2="300" y2="28" stroke="#ec6103" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="300" cy="38" r="3" fill="#ec6103"/>
  <circle cx="300" cy="28" r="2" fill="#ea580c"/>

  <!-- Flanking Left Chatri Crest -->
  <path d="M 235 108 Q 248 95 260 108 Z" fill="#e11d48"/>
  <line x1="248" y1="96" x2="248" y2="82" stroke="#ec6103" stroke-width="1.8"/>

  <!-- Flanking Right Chatri Crest -->
  <path d="M 340 108 Q 352 95 365 108 Z" fill="#e11d48"/>
  <line x1="352" y1="96" x2="352" y2="82" stroke="#ec6103" stroke-width="1.8"/>

  <!-- Delicate White Architectural Filigree / Jali Screen Accents -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.75" fill="none">
    <!-- Fine lines depicting white painted border trims typical of Jaipur architecture -->
    <path d="M 285 278 Q 300 270 315 278"/>
    <path d="M 288 224 Q 300 218 312 224"/>
    <path d="M 285 170 Q 300 162 315 170"/>
    <path d="M 260 122 Q 270 116 280 122"/>
    <path d="M 320 122 Q 330 116 340 122"/>
  </g>

  <!-- Elegant Location Marker & Brand Accent -->
  <g transform="translate(300, 360)">
    <circle cx="0" cy="0" r="12" fill="#ec6103" opacity="0.2"/>
    <circle cx="0" cy="0" r="6" fill="#ec6103"/>
    <circle cx="0" cy="0" r="2.5" fill="#ffffff"/>
  </g>
</svg>
