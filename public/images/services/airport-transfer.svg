<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Airport Sky Gradient -->
    <linearGradient id="airport-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Warm Horizon Amber Glow -->
    <radialGradient id="airport-sun" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#fff7ed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Terminal Glass Canopy Gradient -->
    <linearGradient id="terminal-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="airport-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="airport-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="airport-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <linearGradient id="airport-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <radialGradient id="airport-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" rx="16" fill="url(#airport-sky)"/>

  <!-- Morning Horizon Glow -->
  <circle cx="480" cy="110" r="120" fill="url(#airport-sun)"/>

  <!-- SUBTLE AIRPLANE TAKING OFF IN UPPER SKY -->
  <g transform="translate(430, 45) scale(0.65)" opacity="0.65">
    <!-- Contrail Jet Stream -->
    <line x1="-120" y1="60" x2="-20" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <line x1="-120" y1="60" x2="-20" y2="15" stroke="#fdba74" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Commercial Jet Airplane Silhouette (Ascending) -->
    <!-- Fuselage -->
    <path d="M 40 -12 Q 20 -8 0 0 L -45 18 Q -50 20 -48 24 L -40 23 L -10 12 L 20 4 Q 45 -4 40 -12 Z" fill="#0c1621"/>
    <!-- Main Swept Wings -->
    <polygon points="12,5 -20,45 -10,45 22,3" fill="#ec6103"/>
    <!-- Upper Wing -->
    <polygon points="18,1 -10,-35 -4,-33 24,0" fill="#0c1621"/>
    <!-- Tail Fin (Empennage) -->
    <polygon points="-38,18 -52,-2 -46,-2 -30,16" fill="#ec6103"/>
  </g>

  <!-- MODERN AIRPORT TERMINAL & CONTROL TOWER (Background) -->
  <g opacity="0.45">
    <!-- Air Traffic Control Tower (Far Right) -->
    <rect x="525" y="40" width="16" height="150" fill="#cbd5e1"/>
    <polygon points="515,40 551,40 545,20 521,20" fill="#0c1621"/>
    <!-- Radar Dome -->
    <circle cx="533" cy="14" r="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="533" y1="8" x2="533" y2="2" stroke="#ec6103" stroke-width="1.5"/>

    <!-- Terminal Aerodynamic Curved Canopy -->
    <path d="M 280 180 Q 400 110 520 160 L 520 290 L 280 290 Z" fill="url(#terminal-glass)"/>
    <path d="M 270 185 Q 400 105 530 155" fill="none" stroke="#ffffff" stroke-width="3"/>
    <!-- Glass Mullions -->
    <line x1="330" y1="170" x2="330" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="380" y1="145" x2="380" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="430" y1="135" x2="430" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="480" y1="145" x2="480" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>

    <!-- Terminal Departures / Arrivals Sign -->
    <rect x="360" y="210" width="100" height="16" rx="2" fill="#0c1621"/>
    <line x1="375" y1="218" x2="445" y2="218" stroke="#ec6103" stroke-width="2"/>
  </g>

  <!-- Airport Ramp & Roadway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <polygon points="0,380 600,380 600,296 0,312" fill="#334155"/>
  <line x1="30" y1="365" x2="570" y2="345" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.8"/>

  <!-- Luggage Cart & Trolley Bags on Terminal Platform -->
  <g transform="translate(485, 245) scale(0.85)" opacity="0.75">
    <!-- Luggage Trolley Frame -->
    <rect x="0" y="32" width="38" height="4" rx="1" fill="#64748b"/>
    <line x1="34" y1="32" x2="38" y2="10" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <circle cx="8" cy="38" r="3" fill="#0c1621"/>
    <circle cx="28" cy="38" r="3" fill="#0c1621"/>
    <!-- Stacked Suitcases -->
    <rect x="4" y="20" width="16" height="12" rx="2" fill="#ec6103"/>
    <line x1="12" y1="20" x2="12" y2="32" stroke="#0c1621" stroke-width="1"/>
    <rect x="18" y="14" width="14" height="18" rx="2" fill="#0c1621"/>
    <line x1="25" y1="14" x2="25" y2="32" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- BUS MANTRA AIRPORT TRANSFER COACH (Main Subject) -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="airport-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#airport-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#airport-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#airport-glass)"/>
    <!-- Window Dividers -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Passenger Headrests -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#airport-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim (Emphasized for Airport Baggage) -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#ec6103"/>
    <rect x="230" y="306" width="60" height="2" fill="#ec6103"/>
    <rect x="320" y="306" width="50" height="2" fill="#ec6103"/>

    <!-- LED Headlights -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Bumper -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEELS -->
    <g transform="translate(145, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#airport-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#airport-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
