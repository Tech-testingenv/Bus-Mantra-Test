<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Hotel Dusk / Evening Sky Gradient -->
    <linearGradient id="hotel-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Warm Hospitality Ambient Glow -->
    <radialGradient id="hotel-sun" cx="65%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fff7ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Hotel Facade Gradients -->
    <linearGradient id="hotel-facade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Warm Glass Lobby Gradient -->
    <linearGradient id="lobby-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="hotel-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="hotel-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="hotel-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <linearGradient id="hotel-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <radialGradient id="hotel-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" rx="16" fill="url(#hotel-sky)"/>

  <!-- Warm Evening Glow -->
  <circle cx="450" cy="110" r="120" fill="url(#hotel-sun)"/>

  <!-- MODERN LUXURY HOTEL (Visually Secondary Background) -->
  <g opacity="0.45">
    <!-- Main Hotel Structure -->
    <rect x="340" y="60" width="220" height="230" rx="4" fill="url(#hotel-facade)"/>

    <!-- Balconies Grid & Architectural Windows -->
    <g fill="#94a3b8">
      <rect x="360" y="90" width="30" height="25" rx="1"/>
      <rect x="405" y="90" width="30" height="25" rx="1"/>
      <rect x="450" y="90" width="30" height="25" rx="1"/>
      <rect x="495" y="90" width="30" height="25" rx="1"/>

      <rect x="360" y="130" width="30" height="25" rx="1"/>
      <rect x="405" y="130" width="30" height="25" rx="1"/>
      <rect x="450" y="130" width="30" height="25" rx="1"/>
      <rect x="495" y="130" width="30" height="25" rx="1"/>

      <rect x="360" y="170" width="30" height="25" rx="1"/>
      <rect x="405" y="170" width="30" height="25" rx="1"/>
      <rect x="450" y="170" width="30" height="25" rx="1"/>
      <rect x="495" y="170" width="30" height="25" rx="1"/>
    </g>

    <!-- Warm Glowing Lobby Ground Level -->
    <rect x="340" y="220" width="220" height="70" fill="url(#lobby-glow)" opacity="0.75"/>
    <line x1="390" y1="220" x2="390" y2="290" stroke="#ffffff" stroke-width="2"/>
    <line x1="440" y1="220" x2="440" y2="290" stroke="#ffffff" stroke-width="2"/>
    <line x1="490" y1="220" x2="490" y2="290" stroke="#ffffff" stroke-width="2"/>

    <!-- Hotel Porte-Cochère Canopy -->
    <polygon points="320,225 560,225 540,215 340,215" fill="#0c1621"/>
    <!-- Canopy Support Columns -->
    <rect x="345" y="225" width="6" height="65" fill="#ec6103"/>
    <rect x="525" y="225" width="6" height="65" fill="#ec6103"/>
  </g>

  <!-- Paved Hotel Driveway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <polygon points="0,380 600,380 600,296 0,312" fill="#334155"/>
  <line x1="30" y1="365" x2="570" y2="345" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.8"/>

  <!-- Bellhop Brass Luggage Trolley & Suite Bags -->
  <g transform="translate(485, 240) scale(0.85)" opacity="0.75">
    <!-- Brass Luggage Trolley Birdcage Arch -->
    <path d="M 8 36 L 8 12 Q 22 2 36 12 L 36 36 Z" fill="none" stroke="#f59e0b" stroke-width="2.5"/>
    <line x1="22" y1="5" x2="22" y2="36" stroke="#f59e0b" stroke-width="2"/>
    <rect x="4" y="36" width="36" height="4" rx="1" fill="#b45309"/>
    <circle cx="10" cy="42" r="3" fill="#0c1621"/>
    <circle cx="34" cy="42" r="3" fill="#0c1621"/>
    <!-- Stacked Luxury Bags on Trolley -->
    <rect x="12" y="24" width="20" height="12" rx="2" fill="#ec6103"/>
    <rect x="15" y="16" width="14" height="8" rx="1.5" fill="#0c1621"/>
  </g>

  <!-- BUS MANTRA LUXURY HOTEL TRANSFER COACH (Main Subject) -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="hotel-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#hotel-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#hotel-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#hotel-glass)"/>
    <!-- Window Dividers -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Headrests -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#hotel-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="230" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="320" y="306" width="50" height="2" fill="#64748b"/>

    <!-- LED Headlights -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Bumper -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEELS -->
    <g transform="translate(145, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#hotel-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#hotel-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
