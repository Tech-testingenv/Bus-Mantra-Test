<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Scenic Countryside Sky Gradient -->
    <linearGradient id="tours-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Warm Golden Sun Glow -->
    <radialGradient id="tours-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#fff7ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Rolling Hills Gradients -->
    <linearGradient id="hill-far" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="hill-mid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="tours-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tours-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tours-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <linearGradient id="tours-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <radialGradient id="tours-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" rx="16" fill="url(#tours-sky)"/>

  <!-- Morning Travel Sun -->
  <circle cx="430" cy="115" r="110" fill="url(#tours-sun)"/>
  <circle cx="430" cy="115" r="42" fill="#ffffff" opacity="0.6"/>

  <!-- Rolling Scenic Hills (Background) -->
  <path d="M 0 220 Q 140 160 300 190 Q 460 150 600 200 L 600 280 L 0 280 Z" fill="url(#hill-far)" opacity="0.4"/>
  <path d="M 0 240 Q 180 190 360 220 Q 500 190 600 225 L 600 290 L 0 290 Z" fill="url(#hill-mid)" opacity="0.35"/>

  <!-- Subtle Mountain Route Arcs -->
  <path d="M 40 180 C 140 140, 240 170, 360 140 C 460 110, 520 160, 570 140" fill="none" stroke="#ec6103" stroke-width="1.5" stroke-dasharray="5 7" opacity="0.4"/>
  <circle cx="70" cy="165" r="3" fill="#ec6103" opacity="0.6"/>
  <circle cx="510" cy="135" r="3" fill="#ec6103" opacity="0.6"/>

  <!-- Scenic Highway Roadway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <polygon points="0,380 600,380 600,296 0,312" fill="#334155"/>
  <line x1="30" y1="365" x2="570" y2="345" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.8"/>

  <!-- Scenic Roadside Pine / Shade Trees -->
  <g fill="#15803d" opacity="0.6">
    <ellipse cx="50" cy="255" rx="20" ry="28"/>
    <rect x="48" y="275" width="4" height="15" fill="#78350f"/>
    <ellipse cx="540" cy="245" rx="24" ry="32"/>
    <rect x="538" y="270" width="4" height="20" fill="#78350f"/>
  </g>

  <!-- Small Group of Travelers & Luggage (Background Right) -->
  <g transform="translate(480, 235) scale(0.85)">
    <!-- Traveler 1 (Adult) -->
    <circle cx="12" cy="12" r="5" fill="#0c1621"/>
    <path d="M 6 20 L 18 20 L 16 48 L 8 48 Z" fill="#0c1621"/>
    <!-- Traveler 2 (Family member) -->
    <circle cx="28" cy="14" r="4.5" fill="#ec6103"/>
    <path d="M 22 22 L 34 22 L 32 48 L 24 48 Z" fill="#ec6103"/>
    <!-- Traveler 3 (Junior / Child) -->
    <circle cx="42" cy="22" r="4" fill="#0c1621"/>
    <path d="M 37 28 L 47 28 L 45 48 L 39 48 Z" fill="#0c1621"/>
    <!-- Travel Suitcases / Trolley -->
    <rect x="52" y="32" width="10" height="16" rx="2" fill="#ec6103"/>
    <line x1="57" y1="32" x2="57" y2="26" stroke="#0c1621" stroke-width="1.5"/>
    <rect x="66" y="36" width="8" height="12" rx="1.5" fill="#334155"/>
  </g>

  <!-- BUS MANTRA LUXURY TOUR COACH (Main Subject) -->
  <!-- Ground Shadow under coach -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="tours-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#tours-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#tours-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#tours-glass)"/>
    <!-- Window Dividers -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Tourist Headrests / Passenger Silhouettes -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#tours-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="230" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="320" y="306" width="50" height="2" fill="#64748b"/>

    <!-- LED Headlights -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Bumper -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEELS -->
    <g transform="translate(145, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#tours-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#tours-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
