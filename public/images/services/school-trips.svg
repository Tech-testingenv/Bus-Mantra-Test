<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- School Morning Sky Gradient -->
    <linearGradient id="school-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Warm Morning Sun Glow -->
    <radialGradient id="school-sun" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#fff7ed" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Academy Brick / Stone Gradient -->
    <linearGradient id="school-stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="50%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="school-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="school-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="school-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <linearGradient id="school-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <radialGradient id="school-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" rx="16" fill="url(#school-sky)"/>

  <!-- Morning Sun -->
  <circle cx="450" cy="100" r="110" fill="url(#school-sun)"/>
  <circle cx="450" cy="100" r="40" fill="#ffffff" opacity="0.6"/>

  <!-- ACADEMY / SCHOOL EDUCATIONAL CAMPUS (Background) -->
  <g opacity="0.45">
    <!-- Main Academy Hall Building -->
    <rect x="350" y="90" width="200" height="200" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="340,90 450,45 560,90" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- School Clock Tower -->
    <rect x="425" y="15" width="50" height="75" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
    <polygon points="420,15 450,-10 480,15" fill="#e2e8f0"/>
    <!-- Clock Face -->
    <circle cx="450" cy="45" r="14" fill="#ffffff" stroke="#ec6103" stroke-width="2"/>
    <line x1="450" y1="45" x2="450" y2="36" stroke="#0c1621" stroke-width="1.5"/>
    <line x1="450" y1="45" x2="456" y2="45" stroke="#0c1621" stroke-width="1.5"/>

    <!-- School Arched Windows Grid -->
    <g fill="#94a3b8">
      <path d="M 370 140 L 370 120 Q 380 112 390 120 L 390 140 Z"/>
      <path d="M 405 140 L 405 120 Q 415 112 425 120 L 425 140 Z"/>
      <path d="M 475 140 L 475 120 Q 485 112 495 120 L 495 140 Z"/>
      <path d="M 510 140 L 510 120 Q 520 112 530 120 L 530 140 Z"/>
      <!-- Lower Windows -->
      <path d="M 370 185 L 370 165 Q 380 157 390 165 L 390 185 Z"/>
      <path d="M 405 185 L 405 165 Q 415 157 425 165 L 425 185 Z"/>
      <path d="M 475 185 L 475 165 Q 485 157 495 165 L 495 185 Z"/>
      <path d="M 510 185 L 510 165 Q 520 157 530 165 L 530 185 Z"/>
    </g>

    <!-- Campus Green Lawn -->
    <path d="M 280 290 Q 420 270 560 290 Z" fill="#86efac"/>
  </g>

  <!-- Paved School Access Roadway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <polygon points="0,380 600,380 600,296 0,312" fill="#334155"/>

  <!-- Pedestrian Safety Crosswalk (Zebra Crossing) -->
  <g fill="#ffffff" opacity="0.85">
    <polygon points="460,380 478,380 460,335 444,335"/>
    <polygon points="488,380 506,380 484,335 468,335"/>
    <polygon points="516,380 534,380 508,335 492,335"/>
    <polygon points="544,380 562,380 532,335 516,335"/>
  </g>

  <!-- Clean Student Group Silhouettes with Backpacks -->
  <g transform="translate(485, 240) scale(0.8)" opacity="0.8">
    <!-- Student 1 (with backpack) -->
    <circle cx="10" cy="12" r="5" fill="#0c1621"/>
    <path d="M 5 20 L 15 20 L 14 48 L 6 48 Z" fill="#0c1621"/>
    <!-- Backpack -->
    <rect x="2" y="24" width="5" height="12" rx="2" fill="#ec6103"/>

    <!-- Student 2 -->
    <circle cx="26" cy="14" r="4.5" fill="#ec6103"/>
    <path d="M 21 21 L 31 21 L 29 48 L 23 48 Z" fill="#ec6103"/>
    <rect x="30" y="23" width="5" height="12" rx="2" fill="#0c1621"/>

    <!-- Student 3 -->
    <circle cx="42" cy="16" r="4.5" fill="#0c1621"/>
    <path d="M 37 23 L 47 23 L 45 48 L 39 48 Z" fill="#0c1621"/>
    <rect x="34" y="25" width="5" height="12" rx="2" fill="#3b82f6"/>
  </g>

  <!-- BUS MANTRA MODERN SCHOOL TRIP COACH (Main Subject) -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="school-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#school-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#school-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#school-glass)"/>
    <!-- Window Dividers -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Student Headrests inside windows -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#school-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="230" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="320" y="306" width="50" height="2" fill="#64748b"/>

    <!-- LED Headlights -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Bumper -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEELS -->
    <g transform="translate(145, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#school-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#school-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
