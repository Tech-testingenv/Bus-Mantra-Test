<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Corporate Ambiance Sky Gradient -->
    <linearGradient id="corp-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Warm Amber Business Sunrise Glow -->
    <radialGradient id="corp-sun" cx="70%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ec6103" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#fed7aa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Office Glass Facade Gradients -->
    <linearGradient id="glass-tower-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="glass-tower-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="corp-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="corp-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Livery Orange -->
    <linearGradient id="corp-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>

    <!-- Tinted Glass -->
    <linearGradient id="corp-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>

    <!-- Wheel Rim Gradient -->
    <radialGradient id="corp-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="600" height="380" rx="16" fill="url(#corp-sky)"/>

  <!-- Morning Business Sun Glow -->
  <circle cx="480" cy="100" r="130" fill="url(#corp-sun)"/>

  <!-- CONTEMPORARY CORPORATE OFFICE BUILDINGS (Minimal Background) -->
  <g opacity="0.45">
    <!-- Far Office Tower 1 -->
    <rect x="360" y="50" width="85" height="240" rx="2" fill="url(#glass-tower-1)"/>
    <!-- Glass Grid Lines -->
    <line x1="380" y1="50" x2="380" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="405" y1="50" x2="405" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="425" y1="50" x2="425" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.6"/>
    <line x1="360" y1="90" x2="445" y2="90" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="360" y1="130" x2="445" y2="130" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="360" y1="170" x2="445" y2="170" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="360" y1="210" x2="445" y2="210" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>

    <!-- High Tech Headquarters Tower 2 (Taller) -->
    <rect x="440" y="25" width="110" height="265" rx="3" fill="url(#glass-tower-2)"/>
    <line x1="470" y1="25" x2="470" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="500" y1="25" x2="500" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="530" y1="25" x2="530" y2="290" stroke="#ffffff" stroke-width="1.2" opacity="0.5"/>
    <line x1="440" y1="65" x2="550" y2="65" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <line x1="440" y1="110" x2="550" y2="110" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <line x1="440" y1="155" x2="550" y2="155" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>
    <line x1="440" y1="200" x2="550" y2="200" stroke="#ffffff" stroke-width="1.2" opacity="0.4"/>

    <!-- Modern Spire on Tower 2 -->
    <line x1="495" y1="25" x2="495" y2="8" stroke="#ec6103" stroke-width="2" stroke-linecap="round"/>
    <circle cx="495" cy="8" r="2.5" fill="#ec6103"/>

    <!-- Left Minimal Office Wing -->
    <rect x="270" y="110" width="95" height="180" rx="2" fill="#cbd5e1" opacity="0.6"/>
    <line x1="300" y1="110" x2="300" y2="290" stroke="#ffffff" stroke-width="1"/>
    <line x1="330" y1="110" x2="330" y2="290" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Paved Corporate Concourse / Roadway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <rect x="0" y="285" width="600" height="95" fill="#cbd5e1"/>
  <!-- Smooth Asphalt Driveway -->
  <polygon points="0,380 600,380 600,298 0,310" fill="#334155"/>
  <!-- Lane Marking (Subtle Orange & White) -->
  <line x1="40" y1="365" x2="560" y2="345" stroke="#ec6103" stroke-width="2.5" stroke-dasharray="14 12" opacity="0.8"/>

  <!-- Subtle Executive Travelers Silhouettes near Building -->
  <g opacity="0.65" transform="translate(480, 240) scale(0.85)">
    <!-- Person 1 with Briefcase -->
    <circle cx="15" cy="10" r="5" fill="#0c1621"/>
    <path d="M 9 18 L 21 18 L 19 45 L 11 45 Z" fill="#0c1621"/>
    <!-- Briefcase -->
    <rect x="22" y="32" width="9" height="7" rx="1" fill="#ec6103"/>
    <line x1="24" y1="32" x2="29" y2="32" stroke="#0c1621" stroke-width="1"/>
    <!-- Person 2 -->
    <circle cx="38" cy="12" r="4.5" fill="#475569"/>
    <path d="M 32 19 L 44 19 L 42 45 L 34 45 Z" fill="#475569"/>
  </g>

  <!-- BUS MANTRA LUXURY CORPORATE COACH (Main Subject - 3/4 Perspective) -->
  <!-- Ground Shadow under coach -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="corporate-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#corp-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#corp-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#corp-glass)"/>
    <!-- Individual Executive Window Dividers & Seat Silhouettes -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Ergonomic Headrest Silhouettes inside windows -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <!-- Windshield Reflection Glare -->
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#corp-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark on Coach Side -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="230" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="320" y="306" width="50" height="2" fill="#64748b"/>

    <!-- Modern LED Headlights (Crisp Projector & DRL Strip) -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <!-- Headlight Beam Flare -->
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Aerodynamic Bumper & Fog Lights -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEEL ASSEMBLIES (Detailed 3/4 Perspective Wheels) -->
    <!-- Rear Dual Wheel Set -->
    <g transform="translate(145, 322)">
      <!-- Outer Black Tire -->
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <!-- Wheel Arch Shadow -->
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <!-- Alloy Rim -->
      <circle cx="0" cy="0" r="16" fill="url(#corp-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>

    <!-- Front Steering Wheel Set -->
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#corp-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Modern Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
