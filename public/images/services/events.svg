<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Evening Celebration Sky Gradient -->
    <linearGradient id="events-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>

    <!-- Warm Festive Ambient Glow -->
    <radialGradient id="events-glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fed7aa" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#fff7ed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <!-- Venue Architecture Gradients -->
    <linearGradient id="venue-stone" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="50%" stop-color="#f5d0fe"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>

    <!-- Red Carpet Gradient -->
    <linearGradient id="red-carpet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>

    <!-- Coach Body Gradients -->
    <linearGradient id="events-body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="events-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="events-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <linearGradient id="events-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="60%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <radialGradient id="events-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </radialGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="600" height="380" rx="16" fill="url(#events-sky)"/>

  <!-- Warm Evening Glow -->
  <circle cx="360" cy="110" r="130" fill="url(#events-glow)"/>

  <!-- ELEGANT EVENT VENUE / WEDDING PAVILION (Background) -->
  <g opacity="0.48">
    <!-- Grand Event Archway Structure -->
    <rect x="360" y="80" width="180" height="210" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Decorative Pillars -->
    <rect x="375" y="110" width="16" height="180" fill="#e2e8f0"/>
    <rect x="510" y="110" width="16" height="180" fill="#e2e8f0"/>
    <!-- Grand Portal Arch -->
    <path d="M 405 290 L 405 180 Q 450 140 495 180 L 495 290 Z" fill="#0c1621" opacity="0.8"/>
    <!-- Golden Chandelier Warm Glow inside Portal -->
    <circle cx="450" cy="190" r="16" fill="#fef08a" opacity="0.8"/>
    <circle cx="450" cy="190" r="6" fill="#f59e0b"/>

    <!-- Venue Pediment / Cornice -->
    <polygon points="350,80 450,45 550,80" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="450" cy="65" r="5" fill="#ec6103"/>

    <!-- Elegant Fairy / Festoon Light Strings -->
    <path d="M 280 80 Q 360 115 440 85 Q 520 115 600 75" fill="none" stroke="#fdba74" stroke-width="1.5"/>
    <!-- Tiny Warm Light Bulbs -->
    <circle cx="320" cy="98" r="3" fill="#fef08a"/>
    <circle cx="360" cy="115" r="3" fill="#fef08a"/>
    <circle cx="400" cy="100" r="3" fill="#fef08a"/>
    <circle cx="440" cy="85" r="3" fill="#fef08a"/>
    <circle cx="480" cy="102" r="3" fill="#fef08a"/>
    <circle cx="520" cy="115" r="3" fill="#fef08a"/>
    <circle cx="560" cy="95" r="3" fill="#fef08a"/>
  </g>

  <!-- Paved Event Driveway -->
  <rect x="0" y="275" width="600" height="105" fill="#e2e8f0"/>
  <polygon points="0,380 600,380 600,296 0,312" fill="#334155"/>

  <!-- Red Carpet Welcome Lane (Right Concourse) -->
  <polygon points="420,380 490,380 465,290 435,290" fill="url(#red-carpet)"/>
  <line x1="420" y1="380" x2="435" y2="290" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>
  <line x1="490" y1="380" x2="465" y2="290" stroke="#fef08a" stroke-width="1.5" opacity="0.8"/>

  <!-- Subtle Event Guests Silhouette near Grand Entrance -->
  <g transform="translate(485, 235) scale(0.85)" opacity="0.7">
    <!-- Guest 1 (Formal attire) -->
    <circle cx="12" cy="12" r="5" fill="#0c1621"/>
    <path d="M 6 20 L 18 20 L 16 48 L 8 48 Z" fill="#0c1621"/>
    <!-- Guest 2 (Festive attire) -->
    <circle cx="28" cy="14" r="4.5" fill="#ec6103"/>
    <path d="M 22 22 L 34 22 L 32 48 L 24 48 Z" fill="#ec6103"/>
  </g>

  <!-- BUS MANTRA LUXURY EVENT COACH (Main Subject) -->
  <ellipse cx="270" cy="342" rx="230" ry="18" fill="#0c1621" opacity="0.35"/>

  <!-- Coach Group -->
  <g id="events-bus">
    <!-- Coach Main Side Body -->
    <path d="M 80 170 L 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 75 322 Q 68 322 68 310 L 70 185 Q 70 170 80 170 Z" fill="url(#events-body)"/>

    <!-- Front Nose 3/4 Perspective Face -->
    <path d="M 410 162 Q 445 162 460 178 L 485 240 Q 492 260 488 285 L 482 322 L 445 322 L 440 260 L 410 162 Z" fill="url(#events-front)" opacity="0.95"/>

    <!-- Side Window Glass Ribbon -->
    <path d="M 95 180 L 405 174 L 438 238 L 438 248 L 95 248 Z" fill="url(#events-glass)"/>
    <!-- Window Dividers -->
    <line x1="145" y1="180" x2="145" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="200" y1="179" x2="200" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="255" y1="178" x2="255" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="310" y1="176" x2="310" y2="248" stroke="#334155" stroke-width="2"/>
    <line x1="365" y1="175" x2="365" y2="248" stroke="#334155" stroke-width="2"/>

    <!-- Luxurious Headrests -->
    <g fill="#475569" opacity="0.6">
      <rect x="110" y="195" width="18" height="24" rx="4"/>
      <rect x="165" y="195" width="18" height="24" rx="4"/>
      <rect x="220" y="195" width="18" height="24" rx="4"/>
      <rect x="275" y="195" width="18" height="24" rx="4"/>
      <rect x="330" y="195" width="18" height="24" rx="4"/>
    </g>

    <!-- Front Panoramic Windshield Glass -->
    <path d="M 405 174 Q 442 174 456 186 L 480 240 L 438 240 Z" fill="#0c1621"/>
    <path d="M 412 178 Q 442 178 454 188 L 474 236 L 440 236 Z" fill="#1e293b"/>
    <polygon points="425,178 440,178 465,236 450,236" fill="#ffffff" opacity="0.25"/>

    <!-- BUS MANTRA Dynamic Signature Orange Livery Swoosh -->
    <path d="M 72 268 C 160 268, 260 260, 360 252 C 410 248, 450 255, 485 272 L 483 290 C 445 275, 400 270, 340 276 C 240 286, 150 288, 72 288 Z" fill="url(#events-orange)"/>
    <path d="M 120 294 C 210 292, 310 285, 410 275 L 450 285 L 430 294 C 340 300, 230 302, 120 302 Z" fill="#0c1621"/>

    <!-- "BUS MANTRA" Brandmark -->
    <g transform="translate(180, 275)">
      <text x="0" y="0" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#ffffff" letter-spacing="2">BUS MANTRA</text>
    </g>

    <!-- Lower Luggage Bays & Chrome Trim -->
    <line x1="90" y1="305" x2="380" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
    <rect x="140" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="230" y="306" width="60" height="2" fill="#64748b"/>
    <rect x="320" y="306" width="50" height="2" fill="#64748b"/>

    <!-- LED Headlights & Beam Flare -->
    <polygon points="468,282 485,280 482,292 466,294" fill="#ffffff"/>
    <polygon points="470,284 482,282 480,290 468,291" fill="#38bdf8"/>
    <polygon points="485,280 570,270 560,310 482,292" fill="#fef08a" opacity="0.25"/>

    <!-- Front Bumper -->
    <path d="M 445 322 L 482 322 Q 487 318 488 300 L 440 300 Z" fill="#1e293b"/>
    <circle cx="476" cy="308" r="3" fill="#ea580c"/>

    <!-- WHEELS -->
    <g transform="translate(145, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#events-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
    <g transform="translate(420, 322)">
      <circle cx="0" cy="0" r="26" fill="#0f172a"/>
      <path d="M -30 -2 A 30 30 0 0 1 30 -2" fill="#020617"/>
      <circle cx="0" cy="0" r="16" fill="url(#events-wheel)"/>
      <circle cx="0" cy="0" r="8" fill="#cbd5e1"/>
      <circle cx="0" cy="0" r="4" fill="#ec6103"/>
    </g>
  </g>

  <!-- Rooftop AC Unit -->
  <rect x="180" y="152" width="130" height="14" rx="4" fill="#e2e8f0"/>
  <rect x="195" y="156" width="30" height="5" rx="1" fill="#64748b"/>
  <rect x="235" y="156" width="30" height="5" rx="1" fill="#64748b"/>
</svg>
