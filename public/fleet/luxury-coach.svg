<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Soft ground shadow -->
    <radialGradient id="lc-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0c1621" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
    <!-- Body gradients -->
    <linearGradient id="lc-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e0e4ec"/>
    </linearGradient>
    <linearGradient id="lc-body-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8edf5"/>
    </linearGradient>
    <!-- Orange livery gradient -->
    <linearGradient id="lc-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="lc-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <linearGradient id="lc-glass-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24374c"/>
      <stop offset="100%" stop-color="#0b141f"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="lc-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="65%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow (Extended for Multi-Axle) -->
  <ellipse cx="305" cy="330" rx="265" ry="22" fill="url(#lc-shadow)"/>
  <ellipse cx="295" cy="326" rx="235" ry="14" fill="#0c1621" opacity="0.18"/>

  <!-- Luxury Coach Group (Multi-Axle Premium Liner) -->
  <g transform="translate(10, 5)">
    <!-- Aerodynamic Integrated Roof AC / Fairing -->
    <path d="M 180 72 L 460 72 Q 495 72 505 82 L 515 90 L 150 90 L 165 80 Q 170 72 180 72 Z" fill="#e2e7ef" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="200" y="78" width="40" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="255" y="78" width="40" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="310" y="78" width="40" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="365" y="78" width="40" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="420" y="78" width="40" height="6" rx="3" fill="#cbd3e0"/>

    <!-- Main Body Side & Roof (Extra Long High-Deck Touring Coach) -->
    <path d="M 155 90 Q 170 90 190 90 L 555 90 Q 575 90 580 108 L 575 275 Q 575 285 565 285 L 155 285 L 130 270 L 130 108 Q 135 90 155 90 Z" fill="url(#lc-body-side)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Cap (3/4 Angled Sleek Swept-Back Face) -->
    <path d="M 68 155 Q 82 98 130 90 L 155 90 L 155 285 L 80 282 Q 58 280 56 250 L 62 175 Q 65 160 68 155 Z" fill="url(#lc-body-front)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Panoramic Double-Curved Windshield -->
    <path d="M 72 148 Q 85 106 128 98 L 155 96 L 155 198 L 80 198 L 72 168 Q 71 154 72 148 Z" fill="url(#lc-glass-front)"/>
    <line x1="155" y1="140" x2="74" y2="140" stroke="#0c1621" stroke-width="2"/>
    <!-- Windshield Reflection -->
    <path d="M 90 108 L 125 100 L 108 192 L 82 192 Z" fill="#ffffff" opacity="0.14"/>
    <!-- Windshield Wipers -->
    <line x1="110" y1="195" x2="135" y2="150" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="90" y1="195" x2="110" y2="155" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Side Passenger Windows (High-Deck Panoramic Continuous Glass) -->
    <!-- Window 1: Front bay -->
    <path d="M 165 98 L 245 98 L 245 190 L 165 190 Z" fill="url(#lc-glass)"/>
    <!-- Window 2: Mid-front -->
    <path d="M 252 98 L 350 98 L 350 190 L 252 190 Z" fill="url(#lc-glass)"/>
    <!-- Window 3: Mid-rear -->
    <path d="M 357 98 L 460 98 L 460 190 L 357 190 Z" fill="url(#lc-glass)"/>
    <!-- Window 4: Rear lounge bay -->
    <path d="M 467 98 L 565 98 Q 573 98 573 112 L 568 190 L 467 190 Z" fill="url(#lc-glass)"/>

    <!-- Continuous Top Chrome Finisher Line -->
    <line x1="165" y1="96" x2="570" y2="96" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="165" y1="192" x2="570" y2="192" stroke="#e2e8f0" stroke-width="2"/>

    <!-- Window Pillar Sheen Highlights -->
    <polygon points="180,98 215,98 190,190 165,190" fill="#ffffff" opacity="0.1"/>
    <polygon points="280,98 320,98 290,190 260,190" fill="#ffffff" opacity="0.1"/>
    <polygon points="385,98 425,98 395,190 365,190" fill="#ffffff" opacity="0.1"/>
    <polygon points="495,98 535,98 505,190 475,190" fill="#ffffff" opacity="0.1"/>

    <!-- Brand Livery: Dynamic Luxury Orange & Gold Swoosh Graphic -->
    <path d="M 65 228 Q 110 224 155 220 Q 240 210 330 232 Q 430 255 520 215 L 575 215 L 575 252 Q 470 290 380 260 Q 280 230 190 248 L 70 256 Z" fill="url(#lc-orange)"/>
    <path d="M 200 242 Q 290 226 390 258 Q 480 285 575 260 L 575 270 Q 480 295 380 268 Q 280 242 200 242 Z" fill="#0c1621" opacity="0.9"/>
    <!-- Upper accent orange blade -->
    <path d="M 95 210 Q 135 208 165 212 L 165 216 Q 130 213 90 217 Z" fill="url(#lc-orange)"/>

    <!-- Luggage Compartments (Extra Large Touring Capacity) -->
    <rect x="220" y="246" width="55" height="32" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="240" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>
    <rect x="285" y="246" width="55" height="32" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="305" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>
    <rect x="350" y="246" width="55" height="32" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="370" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>

    <!-- Bus Mantra Premium Typography Stamp -->
    <g transform="translate(260, 198) scale(0.8)">
      <rect x="0" y="0" width="155" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="77" y="15" fill="#0c1621" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="1">BUS MANTRA</text>
    </g>

    <!-- Front Fascia & Details -->
    <!-- Front Grille with Chrome Trim -->
    <path d="M 62 225 L 145 224 L 145 242 L 61 245 Z" fill="#1b2533"/>
    <rect x="75" y="230" width="55" height="5" rx="2.5" fill="#ec6103"/>
    <!-- Headlight Unit (Dual Projector LED with DRL Brow) -->
    <path d="M 60 212 L 85 210 L 83 226 L 60 228 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="62,214 80,212 79,222 62,223" fill="#fef08a"/>
    <circle cx="70" cy="217" r="3" fill="#ffffff"/>
    <circle cx="78" cy="216" r="3" fill="#ffffff"/>
    <!-- Orange DRL Brow -->
    <line x1="60" y1="210" x2="85" y2="208" stroke="#ec6103" stroke-width="2"/>

    <!-- Front Bumper & Aero Lip -->
    <path d="M 56 265 L 155 265 L 155 285 L 75 283 Q 56 280 56 265 Z" fill="#1b2533"/>
    <rect x="62" y="275" width="20" height="4" rx="2" fill="#ec6103"/>

    <!-- Side Mirror (Double Arm Panoramic Mirror with Turn LED) -->
    <path d="M 85 98 Q 50 90 45 115 Q 42 142 55 170 L 62 170 Q 52 145 54 125 Q 58 106 90 112 Z" fill="#ec6103" stroke="#0c1621" stroke-width="1"/>
    <rect x="46" y="120" width="9" height="45" rx="3" fill="#1e293b"/>
    <line x1="48" y1="135" x2="48" y2="150" stroke="#fef08a" stroke-width="2.5"/>

    <!-- Passenger Door Line -->
    <line x1="175" y1="190" x2="175" y2="280" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="177" y="218" width="4" height="12" rx="1.5" fill="#64748b"/>

    <!-- Wheel Wells & Wheels (MULTI-AXLE: 1 Front + 2 Rear) -->
    <!-- Front Wheel Well -->
    <path d="M 120 285 A 36 36 0 0 1 192 285 Z" fill="#0c1621"/>
    <!-- Front Wheel -->
    <circle cx="156" cy="285" r="33" fill="url(#lc-wheel)"/>
    <circle cx="156" cy="285" r="21" fill="#64748b"/>
    <circle cx="156" cy="285" r="13" fill="#cbd3e0"/>
    <circle cx="156" cy="285" r="5" fill="#ec6103"/>

    <!-- Rear Wheel Well 1 (Axle 1) -->
    <path d="M 415 285 A 36 36 0 0 1 487 285 Z" fill="#0c1621"/>
    <!-- Rear Wheel 1 -->
    <circle cx="451" cy="285" r="33" fill="url(#lc-wheel)"/>
    <circle cx="451" cy="285" r="21" fill="#64748b"/>
    <circle cx="451" cy="285" r="13" fill="#cbd3e0"/>
    <circle cx="451" cy="285" r="5" fill="#ec6103"/>

    <!-- Rear Wheel Well 2 (Axle 2 - Tag Axle for Multi-Axle Luxury Bus) -->
    <path d="M 488 285 A 36 36 0 0 1 560 285 Z" fill="#0c1621"/>
    <!-- Rear Wheel 2 -->
    <circle cx="524" cy="285" r="33" fill="url(#lc-wheel)"/>
    <circle cx="524" cy="285" r="21" fill="#64748b"/>
    <circle cx="524" cy="285" r="13" fill="#cbd3e0"/>
    <circle cx="524" cy="285" r="5" fill="#ec6103"/>
  </g>
</svg>
