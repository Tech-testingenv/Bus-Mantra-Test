<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Soft ground shadow -->
    <radialGradient id="sl-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0c1621" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
    <!-- Body gradients -->
    <linearGradient id="sl-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#dfe4ec"/>
    </linearGradient>
    <linearGradient id="sl-body-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e6ecf4"/>
    </linearGradient>
    <!-- Orange livery gradient -->
    <linearGradient id="sl-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="sl-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <linearGradient id="sl-glass-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#24374c"/>
      <stop offset="100%" stop-color="#0b141f"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="sl-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="65%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="330" rx="260" ry="22" fill="url(#sl-shadow)"/>
  <ellipse cx="290" cy="326" rx="230" ry="14" fill="#0c1621" opacity="0.18"/>

  <!-- Sleeper Coach Group (Tall High-Roof Dual-Level Berth Coach) -->
  <g transform="translate(10, 5)">
    <!-- Aerodynamic High-Roof Fairing / AC Units -->
    <path d="M 190 62 L 450 62 Q 480 62 490 70 L 500 78 L 160 78 L 175 68 Q 180 62 190 62 Z" fill="#e2e7ef" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="210" y="67" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="260" y="67" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="310" y="67" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="360" y="67" width="35" height="5" rx="2.5" fill="#cbd3e0"/>
    <rect x="410" y="67" width="35" height="5" rx="2.5" fill="#cbd3e0"/>

    <!-- Main High-Deck Body Side & Roof -->
    <path d="M 160 78 Q 175 78 195 78 L 545 78 Q 565 78 570 96 L 565 275 Q 565 285 555 285 L 160 285 L 135 270 L 135 96 Q 140 78 160 78 Z" fill="url(#sl-body-side)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Cap (3/4 Angled Aerodynamic High-Deck Face) -->
    <path d="M 75 150 Q 88 88 135 78 L 160 78 L 160 285 L 85 282 Q 62 280 60 250 L 68 175 Q 72 155 75 150 Z" fill="url(#sl-body-front)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Windshield (Tall Swept Windshield) -->
    <path d="M 78 145 Q 90 95 132 86 L 160 84 L 160 195 L 85 195 L 78 165 Q 77 150 78 145 Z" fill="url(#sl-glass-front)"/>
    <line x1="160" y1="135" x2="80" y2="135" stroke="#0c1621" stroke-width="2"/>
    <!-- Windshield Reflection -->
    <path d="M 95 98 L 130 90 L 112 188 L 86 188 Z" fill="#ffffff" opacity="0.14"/>
    <!-- Windshield Wipers -->
    <line x1="115" y1="192" x2="140" y2="145" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="95" y1="192" x2="115" y2="150" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- SLEEPER DUAL TIER WINDOWS -->
    <!-- UPPER TIER SLEEPER WINDOWS (Berth level 2) -->
    <path d="M 170 88 L 255 88 L 255 132 L 170 132 Z" fill="url(#sl-glass)"/>
    <path d="M 262 88 L 355 88 L 355 132 L 262 132 Z" fill="url(#sl-glass)"/>
    <path d="M 362 88 L 455 88 L 455 132 L 362 132 Z" fill="url(#sl-glass)"/>
    <path d="M 462 88 L 555 88 Q 563 88 563 100 L 560 132 L 462 132 Z" fill="url(#sl-glass)"/>

    <!-- Horizontal Divider Band Between Sleeper Tiers with Orange Accent -->
    <rect x="170" y="132" width="395" height="12" fill="#ffffff"/>
    <line x1="170" y1="138" x2="560" y2="138" stroke="#ec6103" stroke-width="2.5"/>

    <!-- LOWER TIER SLEEPER WINDOWS (Berth level 1) -->
    <path d="M 170 144 L 255 144 L 255 188 L 170 188 Z" fill="url(#sl-glass)"/>
    <path d="M 262 144 L 355 144 L 355 188 L 262 188 Z" fill="url(#sl-glass)"/>
    <path d="M 362 144 L 455 144 L 455 188 L 362 188 Z" fill="url(#sl-glass)"/>
    <path d="M 462 144 L 555 144 L 558 188 L 462 188 Z" fill="url(#sl-glass)"/>

    <!-- Berth Curtains / Soft Interior Amber Night Glow -->
    <rect x="175" y="93" width="75" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="267" y="93" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="367" y="93" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="467" y="93" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="175" y="149" width="75" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="267" y="149" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="367" y="149" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>
    <rect x="467" y="149" width="83" height="4" rx="1" fill="#fef08a" opacity="0.35"/>

    <!-- Brand Livery: Dynamic Orange Wave -->
    <path d="M 70 228 Q 115 224 160 220 Q 245 210 330 232 Q 425 255 515 215 L 565 215 L 565 252 Q 465 290 375 260 Q 275 230 185 248 L 75 256 Z" fill="url(#sl-orange)"/>
    <path d="M 195 242 Q 285 226 380 258 Q 470 285 565 260 L 565 270 Q 470 295 375 268 Q 275 242 195 242 Z" fill="#0c1621" opacity="0.9"/>

    <!-- Luggage Compartments -->
    <rect x="230" y="246" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="250" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>
    <rect x="295" y="246" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="315" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>
    <rect x="360" y="246" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="380" y="250" width="15" height="3" rx="1.5" fill="#64748b"/>

    <!-- Bus Mantra Sleeper Branding Stamp -->
    <g transform="translate(265, 195) scale(0.75)">
      <rect x="0" y="0" width="165" height="22" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="82" y="15" fill="#0c1621" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">BUS MANTRA SLEEPER</text>
    </g>

    <!-- Front Fascia & Details -->
    <path d="M 68 225 L 150 224 L 150 242 L 67 245 Z" fill="#1b2533"/>
    <rect x="80" y="230" width="55" height="5" rx="2.5" fill="#ec6103"/>
    <!-- Headlight Unit -->
    <path d="M 66 212 L 90 210 L 88 226 L 66 228 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="68,214 86,212 85,222 68,223" fill="#fef08a"/>
    <circle cx="76" cy="217" r="3" fill="#ffffff"/>

    <!-- Front Bumper -->
    <path d="M 60 265 L 160 265 L 160 285 L 80 283 Q 60 280 60 265 Z" fill="#1b2533"/>

    <!-- Side Mirror (Extended Tall Mirror) -->
    <path d="M 90 92 Q 55 85 50 110 Q 46 142 58 175 L 66 175 Q 56 148 58 122 Q 62 102 96 108 Z" fill="#ec6103" stroke="#0c1621" stroke-width="1"/>
    <rect x="52" y="115" width="9" height="50" rx="3" fill="#1e293b"/>

    <!-- Passenger Door Line -->
    <line x1="180" y1="188" x2="180" y2="280" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="182" y="218" width="4" height="12" rx="1.5" fill="#64748b"/>

    <!-- Wheel Wells & Wheels -->
    <!-- Front Wheel Well -->
    <path d="M 125 285 A 36 36 0 0 1 197 285 Z" fill="#0c1621"/>
    <circle cx="161" cy="285" r="33" fill="url(#sl-wheel)"/>
    <circle cx="161" cy="285" r="21" fill="#64748b"/>
    <circle cx="161" cy="285" r="13" fill="#cbd3e0"/>
    <circle cx="161" cy="285" r="5" fill="#ec6103"/>

    <!-- Rear Wheel Well -->
    <path d="M 455 285 A 36 36 0 0 1 527 285 Z" fill="#0c1621"/>
    <circle cx="491" cy="285" r="33" fill="url(#sl-wheel)"/>
    <circle cx="491" cy="285" r="21" fill="#64748b"/>
    <circle cx="491" cy="285" r="13" fill="#cbd3e0"/>
    <circle cx="491" cy="285" r="5" fill="#ec6103"/>
  </g>
</svg>
