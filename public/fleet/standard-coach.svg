<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <!-- Soft ground shadow -->
    <radialGradient id="sc-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1621" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#0c1621" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0c1621" stop-opacity="0"/>
    </radialGradient>
    <!-- Body gradients -->
    <linearGradient id="sc-body-side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="85%" stop-color="#f5f7fa"/>
      <stop offset="100%" stop-color="#e2e6ed"/>
    </linearGradient>
    <linearGradient id="sc-body-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eaeff6"/>
    </linearGradient>
    <!-- Orange livery gradient -->
    <linearGradient id="sc-orange" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ec6103"/>
      <stop offset="100%" stop-color="#ff7919"/>
    </linearGradient>
    <!-- Glass gradient -->
    <linearGradient id="sc-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142233"/>
      <stop offset="50%" stop-color="#0c1621"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <linearGradient id="sc-glass-front" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#223348"/>
      <stop offset="100%" stop-color="#0c1621"/>
    </linearGradient>
    <!-- Wheel gradient -->
    <radialGradient id="sc-wheel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d4957"/>
      <stop offset="65%" stop-color="#1b222c"/>
      <stop offset="100%" stop-color="#0c1219"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="300" cy="330" rx="255" ry="22" fill="url(#sc-shadow)"/>
  <ellipse cx="290" cy="326" rx="225" ry="14" fill="#0c1621" opacity="0.18"/>

  <!-- Standard Coach Group (35-40 Seater Single-Axle) -->
  <g transform="translate(10, 5)">
    <!-- Aerodynamic Roof Spoiler / AC Unit -->
    <path d="M 210 74 L 430 74 Q 455 74 465 82 L 470 92 L 180 92 L 190 82 Q 195 74 210 74 Z" fill="#e2e7ef" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="225" y="80" width="35" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="275" y="80" width="35" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="325" y="80" width="35" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="375" y="80" width="35" height="6" rx="3" fill="#cbd3e0"/>
    <rect x="425" y="80" width="25" height="6" rx="3" fill="#cbd3e0"/>

    <!-- Main Body Side & Roof -->
    <path d="M 165 92 Q 180 92 200 92 L 535 92 Q 555 92 560 110 L 555 275 Q 555 285 545 285 L 165 285 L 140 270 L 140 110 Q 145 92 165 92 Z" fill="url(#sc-body-side)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Cap (3/4 Angled Face) -->
    <path d="M 85 155 Q 98 102 142 94 L 165 92 L 165 285 L 95 282 Q 74 280 72 250 L 78 175 Q 82 160 85 155 Z" fill="url(#sc-body-front)" stroke="#cbd3e0" stroke-width="1.5"/>

    <!-- Front Windshield (Two-piece aerodynamic standard coach glass) -->
    <path d="M 90 150 Q 100 112 138 104 L 165 102 L 165 200 L 95 200 L 88 170 Q 89 155 90 150 Z" fill="url(#sc-glass-front)"/>
    <line x1="165" y1="145" x2="90" y2="145" stroke="#0c1621" stroke-width="2"/>
    <!-- Windshield Reflection -->
    <path d="M 105 114 L 135 106 L 120 195 L 98 195 Z" fill="#ffffff" opacity="0.12"/>
    <!-- Windshield Wipers -->
    <line x1="125" y1="198" x2="145" y2="155" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="105" y1="198" x2="120" y2="160" stroke="#000000" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Side Passenger Windows (4 Large Touring Bays) -->
    <!-- Window 1: Front bay / door -->
    <path d="M 175 104 L 245 104 L 245 192 L 175 192 Z" fill="url(#sc-glass)"/>
    <!-- Window 2: Mid-front -->
    <path d="M 253 104 L 345 104 L 345 192 L 253 192 Z" fill="url(#sc-glass)"/>
    <!-- Window 3: Mid-rear -->
    <path d="M 353 104 L 445 104 L 445 192 L 353 192 Z" fill="url(#sc-glass)"/>
    <!-- Window 4: Rear bay -->
    <path d="M 453 104 L 545 104 Q 553 104 553 118 L 548 192 L 453 192 Z" fill="url(#sc-glass)"/>

    <!-- Window Pillar Sheen Highlights -->
    <polygon points="190,104 220,104 200,192 175,192" fill="#ffffff" opacity="0.08"/>
    <polygon points="280,104 315,104 290,192 260,192" fill="#ffffff" opacity="0.08"/>
    <polygon points="380,104 415,104 390,192 360,192" fill="#ffffff" opacity="0.08"/>
    <polygon points="480,104 515,104 490,192 460,192" fill="#ffffff" opacity="0.08"/>

    <!-- Brand Livery: Dynamic Orange Swoosh (Signature Bus Mantra Wave) -->
    <path d="M 80 230 Q 120 228 165 224 Q 240 215 320 235 Q 410 258 500 218 L 555 218 L 555 255 Q 460 290 370 260 Q 280 230 200 248 L 85 256 Z" fill="url(#sc-orange)"/>
    <path d="M 210 242 Q 290 228 380 258 Q 470 285 555 262 L 555 272 Q 470 295 370 270 Q 280 242 210 242 Z" fill="#0c1621" opacity="0.9"/>
    <!-- Lower orange accent pinstripe -->
    <path d="M 105 215 Q 140 212 165 215 L 165 220 Q 135 218 100 222 Z" fill="url(#sc-orange)"/>

    <!-- Luggage Compartment Doors (Below window line) -->
    <rect x="235" y="248" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="255" y="252" width="14" height="3" rx="1.5" fill="#64748b"/>
    <rect x="300" y="248" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="320" y="252" width="14" height="3" rx="1.5" fill="#64748b"/>
    <rect x="365" y="248" width="55" height="30" rx="2" fill="none" stroke="#cbd3e0" stroke-width="1.2"/>
    <rect x="385" y="252" width="14" height="3" rx="1.5" fill="#64748b"/>

    <!-- Bus Mantra Side Typography Brand -->
    <g transform="translate(250, 200) scale(0.75)">
      <rect x="0" y="0" width="145" height="20" rx="4" fill="#ffffff" opacity="0.95"/>
      <text x="72" y="14" fill="#0c1621" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="1">BUS MANTRA</text>
    </g>

    <!-- Front Fascia & Details -->
    <!-- Front Grille -->
    <path d="M 78 228 L 155 226 L 155 242 L 77 245 Z" fill="#1b2533"/>
    <rect x="90" y="232" width="50" height="5" rx="2.5" fill="#ec6103"/>
    <!-- Headlight Unit (Modern Coach LED) -->
    <path d="M 76 214 L 98 212 L 96 226 L 76 228 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <polygon points="78,216 94,214 93,224 78,225" fill="#fef08a"/>
    <circle cx="86" cy="219" r="3.5" fill="#ffffff"/>

    <!-- Front Bumper -->
    <path d="M 72 265 L 165 265 L 165 285 L 90 283 Q 72 280 72 265 Z" fill="#1b2533"/>

    <!-- Side Mirror (Long Arm Tourist Coach Mirror) -->
    <path d="M 98 105 Q 70 95 65 120 Q 62 145 72 170 L 78 170 Q 70 148 72 130 Q 75 112 102 118 Z" fill="#ec6103" stroke="#0c1621" stroke-width="1"/>
    <rect x="66" y="125" width="8" height="42" rx="3" fill="#1e293b"/>

    <!-- Passenger Door Line -->
    <line x1="185" y1="192" x2="185" y2="280" stroke="#cbd3e0" stroke-width="1.5"/>
    <rect x="187" y="222" width="4" height="10" rx="1.5" fill="#64748b"/>

    <!-- Wheel Wells & Wheels -->
    <!-- Front Wheel Well -->
    <path d="M 130 285 A 38 38 0 0 1 206 285 Z" fill="#0c1621"/>
    <!-- Front Wheel -->
    <circle cx="168" cy="285" r="34" fill="url(#sc-wheel)"/>
    <circle cx="168" cy="285" r="22" fill="#64748b"/>
    <circle cx="168" cy="285" r="14" fill="#cbd3e0"/>
    <circle cx="168" cy="285" r="6" fill="#ec6103"/>
    <!-- Rim bolts -->
    <circle cx="168" cy="273" r="1.5" fill="#ffffff"/>
    <circle cx="179" cy="281" r="1.5" fill="#ffffff"/>
    <circle cx="175" cy="294" r="1.5" fill="#ffffff"/>
    <circle cx="161" cy="294" r="1.5" fill="#ffffff"/>
    <circle cx="157" cy="281" r="1.5" fill="#ffffff"/>

    <!-- Rear Wheel Well -->
    <path d="M 445 285 A 38 38 0 0 1 521 285 Z" fill="#0c1621"/>
    <!-- Rear Wheel -->
    <circle cx="483" cy="285" r="34" fill="url(#sc-wheel)"/>
    <circle cx="483" cy="285" r="22" fill="#64748b"/>
    <circle cx="483" cy="285" r="14" fill="#cbd3e0"/>
    <circle cx="483" cy="285" r="6" fill="#ec6103"/>
    <!-- Rim bolts -->
    <circle cx="483" cy="273" r="1.5" fill="#ffffff"/>
    <circle cx="494" cy="281" r="1.5" fill="#ffffff"/>
    <circle cx="490" cy="294" r="1.5" fill="#ffffff"/>
    <circle cx="476" cy="294" r="1.5" fill="#ffffff"/>
    <circle cx="472" cy="281" r="1.5" fill="#ffffff"/>
  </g>
</svg>
